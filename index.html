us","t":"shrub","fl":4,"dr":3,"h":"2–4 m","m":[5,6],"c":"white","p":4,"hb":"shrub","so":"both","sa":"low","n":{"en":"Red berries into winter; a floodplain shrub.","de":"Rote Beeren bis in den Winter; ein Strauch der Auen."},"f":[]},{"id":"cornus","z":"D","de":"Blutroter Hartriegel","en":"Dogwood","la":"Cornus sanguinea","t":"shrub","fl":3,"dr":4,"h":"2–5 m","m":[5,6],"c":"white","p":4,"hb":"suckering","so":"marsch","sa":"low","n":{"en":"Prefers base-rich soils; in the north-west lowlands mainly in large river valleys.","de":"Bevorzugt basenreiche Böden; im nordwestdeutschen Tiefland vor allem in großen Flusstälern."},"f":[]},{"id":"sambucus","z":"D","de":"Schwarzer Holunder","en":"Elder","la":"Sambucus nigra","t":"shrub","fl":2,"dr":3,"h":"3–7 m","m":[5,6],"c":"cream","p":4,"hb":"shrub","so":"both","sa":"low","n":{"en":"Upper rim only; likes nutrient-rich soil; fruit for birds.","de":"Nur am oberen Rand; mag nährstoffreiche Böden; Früchte für Vögel."},"f":[]},{"id":"myrica","z":"D","de":"Gagelstrauch","en":"Bog-myrtle","la":"Myrica gale","t":"shrub","fl":4,"dr":2,"h":"0.5–1.5 m","m":[4,5],"c":"brown","p":1,"hb":"suckering","so":"geest","sa":"low","n":{"en":"Aromatic bog shrub; rare, so check the Hamburg Red List and use nursery-propagated stock.","de":"Aromatischer Moorstrauch; selten – Rote Liste Hamburg prüfen und nur Baumschulware verwenden."},"f":["protected"]},{"id":"alnus","z":"D","de":"Schwarz-Erle","en":"Black alder","la":"Alnus glutinosa","t":"tree","fl":5,"dr":2,"h":"15–25 m","m":[2,4],"c":"catkin","p":2,"hb":"tree","so":"both","sa":"low","n":{"en":"Tolerates permanent waterlogging; fixes nitrogen; watch for alder Phytophthora.","de":"Verträgt dauerhafte Staunässe; bindet Stickstoff; auf Erlen-Phytophthora achten."},"f":[]},{"id":"salix_alba","z":"D","de":"Silber-Weide","en":"White willow","la":"Salix alba","t":"tree","fl":5,"dr":3,"h":"15–25 m","m":[4,5],"c":"catkin","p":5,"hb":"tree","so":"marsch","sa":"low","n":{"en":"Softwood floodplain tree; pollard it (Kopfweide) where space is tight.","de":"Baum der Weichholzaue; wo Platz knapp ist, als Kopfweide schneiden."},"f":[]},{"id":"ulmus","z":"D","de":"Flatter-Ulme","en":"European white elm","la":"Ulmus laevis","t":"tree","fl":5,"dr":3,"h":"20–30 m","m":[3,4],"c":"reddish","p":2,"hb":"tree","so":"both","sa":"med","n":{"en":"Survives very long flooding; native to the Elbe floodplain; rarely hit by Dutch elm disease; underused.","de":"Übersteht sehr lange Überflutung; heimisch in der Elbaue; vom Ulmensterben kaum betroffen; zu selten gepflanzt."},"f":[]},{"id":"quercus","z":"D","de":"Stiel-Eiche","en":"Pedunculate oak","la":"Quercus robur","t":"tree","fl":4,"dr":4,"h":"20–35 m","m":[4,5],"c":"catkin","p":2,"hb":"tree","so":"both","sa":"med","n":{"en":"Takes weeks of flooding; supports more insect species than almost any other native tree.","de":"Verträgt wochenlange Überflutung; beherbergt mehr Insektenarten als fast jeder andere heimische Baum."},"f":[]},{"id":"betula_pub","z":"D","de":"Moor-Birke","en":"Downy birch","la":"Betula pubescens","t":"tree","fl":4,"dr":2,"h":"10–20 m","m":[4,5],"c":"catkin","p":1,"hb":"tree","so":"geest","sa":"low","n":{"en":"For acidic, wet ground and bog edges.","de":"Für saure, nasse Böden und Moorränder."},"f":[]},{"id":"prunus_padus","z":"D","de":"Gewöhnliche Traubenkirsche","en":"Bird cherry","la":"Prunus padus","t":"tree","fl":4,"dr":2,"h":"5–15 m","m":[4,5],"c":"white","p":5,"hb":"tree","so":"both","sa":"low","n":{"en":"A floodplain species with early blossom and fruit for birds. Don't confuse it with the invasive Prunus serotina.","de":"Auenart mit früher Blüte und Früchten für Vögel. Nicht mit der invasiven Späten Traubenkirsche verwechseln."},"f":[]}],"colours":{"silvergold":["#C9B98A","silver-gold panicles","silbrig-goldene Rispen"],"brown":["#8A6A4A","brown","braun"],"brownblack":["#4B3A2E","brown-black","braunschwarz"],"greenpurple":["#7E6A8A","green-purple","grün-violett"],"greyviolet":["#8D84A6","grey-violet","grauviolett"],"purplepink":["#B4407C","purple-pink","purpurrosa"],"cream":["#EDE3C2","cream","cremeweiß"],"yellow":["#E2B93B","yellow","gelb"],"white":["#F4F2EA","white","weiß"],"lilac":["#A68BC9","lilac","lila"],"pink":["#D97A9E","pink","rosa"],"blueviolet":["#6F63B8","blue-violet","blauviolett"],"duskypink":["#C98AA0","dusky pink","altrosa"],"palepink":["#E8C4CF","pale pink","zartrosa"],"palelilac":["#CDBFE3","pale lilac","zartlila"],"whitepink":["#EBD3D8","white to pink","weiß bis rosa"],"purple":["#8E4B9C","purple","purpur"],"violetcream":["#8F6FB3","violet or cream","violett oder cremeweiß"],"reddish":["#A85A4A","reddish","rötlich"],"yellowgreen":["#B8B95A","yellow-green","gelbgrün"],"brownishwhite":["#CFC3A8","brownish white","bräunlich-weiß"],"blue":["#5A7FC8","blue","blau"],"violet":["#7C5BB5","violet","violett"],"greenwhite":["#C9D3B5","green-white","grünlich-weiß"],"greenish":["#A8B57A","greenish","grünlich"],"catkin":["#D8C76A","catkins","Kätzchen"],"red":["#B84A3A","purple-red catkins","purpurrote Kätzchen"]},"fauna":[{"id":"melitta","g":"bees","de":"Blutweiderich-Sägehornbiene","en":"Purple-loosestrife bee","la":"Melitta nigricans","m":[7,8],"st":{"en":"Specialist (oligolectic)","de":"Spezialistin (oligolektisch)"},"tx":{"en":"Collects pollen only from purple loosestrife: no Lythrum, no bee. It nests in the ground in sunny, sparsely vegetated spots near the stands.","de":"Sammelt Pollen ausschließlich am Blut-Weiderich – ohne Lythrum keine Biene. Nistet im Boden an sonnigen, lückig bewachsenen Stellen nahe der Bestände."},"pl":[["lythrum","pollen"]],"sr":["open_sand"]},{"id":"macropis","g":"bees","de":"Auen-Schenkelbiene","en":"Yellow loosestrife bee","la":"Macropis europaea","m":[6,8],"st":{"en":"Specialist (oligolectic)","de":"Spezialistin (oligolektisch)"},"tx":{"en":"Mixes floral oil and pollen from yellow loosestrife into its larval food and waterproofs its nest with the oil. It nests in the ground on banks, often close to water.","de":"Mischt Blütenöl und Pollen des Gilbweiderichs ins Larvenfutter und dichtet damit ihr Nest ab. Nistet im Boden an Böschungen, oft nah am Wasser."},"pl":[["lysimachia","pollen"],["lythrum","nectar"]],"sr":["open_sand"]},{"id":"andvaga","g":"bees","de":"Weiden-Sandbiene","en":"Grey-backed mining bee","la":"Andrena vaga","m":[3,4],"st":{"en":"Specialist on willows","de":"Spezialistin für Weiden"},"tx":{"en":"One of the first bees of spring, collecting pollen only from willows. It digs nests in dense colonies in open, sun-warmed sand, so Geest rims with bare sand and willows nearby suit it perfectly.","de":"Eine der ersten Bienen im Frühjahr; sammelt Pollen nur an Weiden. Gräbt ihre Nester in dichten Kolonien in offenem, sonnigem Sand – Geesträder mit offenen Sandstellen und Weiden in der Nähe sind ideal."},"pl":[["salix_cin","pollen"],["salix_aur","pollen"],["salix_pur","pollen"],["salix_vim","pollen"],["salix_alba","pollen"]],"sr":["open_sand"]},{"id":"andhatt","g":"bees","de":"Knautien-Sandbiene","en":"Large scabious mining bee","la":"Andrena hattorfiana","m":[6,8],"st":{"en":"Red-listed specialist","de":"Spezialistin der Roten Liste"},"tx":{"en":"A large mining bee that collects pollen almost only from field scabious. It needs bigger, unmown Knautia stands close to sandy nesting ground.","de":"Große Sandbiene, die fast nur an der Acker-Witwenblume Pollen sammelt. Braucht größere, ungemähte Knautia-Bestände nahe sandiger Nistplätze."},"pl":[["knautia","pollen"]],"sr":["open_sand","unmown"]},{"id":"chelo","g":"bees","de":"Glockenblumen-Scherenbiene","en":"Bellflower scissor bee","la":"Chelostoma rapunculi","m":[6,8],"st":{"en":"Specialist on bellflowers","de":"Spezialistin für Glockenblumen"},"tx":{"en":"Collects pollen only from bellflowers and often spends the night inside the flowers. It nests in beetle holes in deadwood and in hollow stems.","de":"Sammelt Pollen nur an Glockenblumen und übernachtet oft in den Blüten. Nistet in Käferfraßgängen im Totholz und in hohlen Stängeln."},"pl":[["campanula_rot","pollen"]],"sr":["deadwood","standing_stems"]},{"id":"hylaeus","g":"bees","de":"Maskenbienen","en":"Yellow-face bees","la":"Hylaeus spp.","m":[5,9],"st":{"en":"Several species","de":"Mehrere Arten"},"tx":{"en":"Small, almost hairless bees that carry pollen in their crop. Many nest in pithy or hollow plant stems, so dead stems left standing over winter are their nurseries.","de":"Kleine, fast unbehaarte Bienen, die den Pollen im Kropf transportieren. Viele nisten in markhaltigen oder hohlen Stängeln – über Winter stehende Altstängel sind ihre Kinderstube."},"pl":[["daucus","nectar"],["angelica","nectar"],["achillea","nectar"],["campanula_rot","pollen"]],"sr":["standing_stems"]},{"id":"bombus","g":"bees","de":"Ackerhummel","en":"Common carder bee","la":"Bombus pascuorum","m":[3,10],"st":{"en":"Widespread","de":"Weit verbreitet"},"tx":{"en":"A long-tongued bumblebee active from early spring to late autumn. It needs an unbroken run of flowers, especially labiates, legumes and comfrey, and nests above ground in grass tussocks.","de":"Langrüsselige Hummel, aktiv vom zeitigen Frühjahr bis in den Spätherbst. Braucht ein lückenloses Blütenangebot, vor allem Lippenblütler, Schmetterlingsblütler und Beinwell, und nistet oberirdisch in Grasbulten."},"pl":[["symphytum","nectar"],["stachys","nectar"],["vicia","nectar"],["lotus_ped","nectar"],["mentha","nectar"],["lythrum","nectar"],["salix_cin","pollen"]],"sr":["tussocks","unmown"]},{"id":"aurora","g":"butterflies","de":"Aurorafalter","en":"Orange-tip","la":"Anthocharis cardamines","m":[4,6],"st":{"en":"Widespread","de":"Weit verbreitet"},"tx":{"en":"Caterpillars feed on the seed pods of cuckooflower. The pupa overwinters on old stems, so mowing everything in autumn wipes out next year's butterflies.","de":"Die Raupen fressen an den Schoten des Wiesen-Schaumkrauts. Die Puppe überwintert an alten Stängeln – wer im Herbst alles mäht, vernichtet die nächste Generation."},"pl":[["cardamine","host"],["cardamine","nectar"]],"sr":["standing_stems","unmown"]},{"id":"zitron","g":"butterflies","de":"Zitronenfalter","en":"Brimstone","la":"Gonepteryx rhamni","m":[3,10],"st":{"en":"Widespread","de":"Weit verbreitet"},"tx":{"en":"Caterpillars feed on alder buckthorn. Adults overwinter in the open among evergreen leaves and are among the first butterflies in spring, when they feed on willow catkins.","de":"Die Raupen fressen am Faulbaum. Die Falter überwintern frei zwischen immergrünen Blättern und gehören zu den ersten Faltern des Jahres – dann an Weidenkätzchen."},"pl":[["frangula","host"],["salix_cin","nectar"],["lythrum","nectar"],["cirsium_pal","nectar"]],"sr":["dense_scrub"]},{"id":"schwalb","g":"butterflies","de":"Schwalbenschwanz","en":"Swallowtail","la":"Papilio machaon","m":[5,8],"st":{"en":"Specially protected","de":"Besonders geschützt"},"tx":{"en":"Caterpillars feed on umbellifers such as wild carrot. Males gather on high points, and the pupa overwinters on stems.","de":"Die Raupen fressen an Doldenblütlern wie der Wilden Möhre. Die Männchen sammeln sich an erhöhten Punkten; die Puppe überwintert an Stängeln."},"pl":[["daucus","host"],["centaurea","nectar"],["knautia","nectar"],["cirsium_pal","nectar"]],"sr":["standing_stems"]},{"id":"icarus","g":"butterflies","de":"Hauhechel-Bläuling","en":"Common blue","la":"Polyommatus icarus","m":[5,9],"st":{"en":"Specially protected","de":"Besonders geschützt"},"tx":{"en":"Caterpillars feed on bird's-foot-trefoils and other legumes and are tended by ants. Lean, sunny banks with carpets of trefoil support strong colonies.","de":"Die Raupen fressen an Hornklee und anderen Schmetterlingsblütlern und werden von Ameisen betreut. Magere, sonnige Böschungen mit Hornkleeteppichen tragen starke Bestände."},"pl":[["lotus_cor","host"],["lotus_ped","host"],["centaurea","nectar"],["achillea","nectar"]],"sr":["unmown"]},{"id":"ochsen","g":"butterflies","de":"Großes Ochsenauge","en":"Meadow brown","la":"Maniola jurtina","m":[6,9],"st":{"en":"Widespread","de":"Weit verbreitet"},"tx":{"en":"Caterpillars feed on fine grasses at night and overwinter in the sward. Strips left unmown over winter keep the colony alive.","de":"Die Raupen fressen nachts an feinen Gräsern und überwintern in der Grasnarbe. Über Winter ungemähte Streifen sichern den Bestand."},"pl":[["festuca_rubra","host"],["agrostis_cap","host"],["centaurea","nectar"],["knautia","nectar"],["cirsium_pal","nectar"]],"sr":["unmown"]},{"id":"pfau","g":"butterflies","de":"Tagpfauenauge","en":"Peacock","la":"Aglais io","m":[3,10],"st":{"en":"Widespread","de":"Weit verbreitet"},"tx":{"en":"A heavy user of late-summer nectar from hemp-agrimony and thistles. Its caterpillars live on stinging nettle, so a nettle patch at the rim helps.","de":"Nutzt im Spätsommer intensiv den Nektar von Wasserdost und Disteln. Die Raupen leben an Brennnesseln – ein Brennnesselfleck am Rand hilft."},"pl":[["eupatorium","nectar"],["cirsium_pal","nectar"],["lythrum","nectar"],["salix_cin","nectar"]],"sr":["nettle"]},{"id":"plattb","g":"dragonflies","de":"Plattbauch","en":"Broad-bodied chaser","la":"Libellula depressa","m":[5,8],"st":{"en":"Specially protected","de":"Besonders geschützt"},"tx":{"en":"A pioneer that colonises new, sunny ponds with sparse vegetation in their first year. Temporary pools and freshly built retention ponds are its home.","de":"Ein Pionier, der neue, sonnige und spärlich bewachsene Gewässer schon im ersten Jahr besiedelt. Temporäre Tümpel und neu angelegte Retentionsteiche sind sein Lebensraum."},"pl":[["juncus_eff","shelter"]],"sr":["temp_pools","shallow_shelf"]},{"id":"vierfl","g":"dragonflies","de":"Vierfleck","en":"Four-spotted chaser","la":"Libellula quadrimaculata","m":[5,8],"st":{"en":"Specially protected","de":"Besonders geschützt"},"tx":{"en":"Prefers established, vegetation-rich ponds and fens. Males defend territories from perches on rushes and sedges.","de":"Bevorzugt ältere, vegetationsreiche Teiche und Moorgewässer. Die Männchen verteidigen ihr Revier von Ansitzen auf Binsen und Seggen."},"pl":[["juncus_eff","shelter"],["carex_elata","shelter"],["sparganium","shelter"]],"sr":["perches","shallow_shelf"]},{"id":"mosaik","g":"dragonflies","de":"Blaugrüne Mosaikjungfer","en":"Southern hawker","la":"Aeshna cyanea","m":[6,10],"st":{"en":"Specially protected","de":"Besonders geschützt"},"tx":{"en":"Breeds even in small, partly shaded ponds. Females lay their eggs into moist wood, moss and plant tissue at the water's edge.","de":"Pflanzt sich auch in kleinen, teils beschatteten Teichen fort. Die Weibchen legen ihre Eier in feuchtes Holz, Moos und Pflanzengewebe am Ufer."},"pl":[["carex_pan","shelter"],["iris","shelter"]],"sr":["deadwood","shallow_shelf"]},{"id":"pracht","g":"dragonflies","de":"Gebänderte Prachtlibelle","en":"Banded demoiselle","la":"Calopteryx splendens","m":[5,8],"st":{"en":"Specially protected","de":"Besonders geschützt"},"tx":{"en":"Lives on slowly flowing ditches and streams with sunny banks. Larvae cling to submerged roots and plants; adults perch on bank vegetation.","de":"Lebt an langsam fließenden Gräben und Bächen mit sonnigen Ufern. Die Larven halten sich an Wurzeln und Wasserpflanzen fest; die Imagines sitzen auf der Ufervegetation."},"pl":[["sparganium","shelter"],["butomus","shelter"]],"sr":["perches","sectional_care"]},{"id":"azur","g":"dragonflies","de":"Hufeisen-Azurjungfer","en":"Azure damselfly","la":"Coenagrion puella","m":[5,8],"st":{"en":"Specially protected","de":"Besonders geschützt"},"tx":{"en":"One of the commonest damselflies on small ponds. It lays eggs into floating and emergent plants, so a varied margin matters more than size.","de":"Eine der häufigsten Kleinlibellen an Kleingewässern. Legt ihre Eier in Schwimmblatt- und Röhrichtpflanzen – eine vielfältige Uferzone ist wichtiger als die Größe."},"pl":[["persicaria","shelter"],["alisma","shelter"]],"sr":["shallow_shelf"]},{"id":"moorf","g":"amphibians","de":"Moorfrosch","en":"Moor frog","la":"Rana arvalis","m":[3,9],"st":{"en":"Strictly protected (FFH Annex IV)","de":"Streng geschützt (FFH-Anhang IV)"},"tx":{"en":"Males turn sky blue for a few days at spawning time in March or April. It needs wet meadows, fens and Marsch ditches with shallow, sunny, fish-free spawning water.","de":"Die Männchen färben sich zur Laichzeit im März oder April für wenige Tage himmelblau. Braucht Feuchtwiesen, Moore und Marschgräben mit flachem, sonnigem, fischfreiem Laichgewässer."},"pl":[["carex_elata","shelter"],["juncus_eff","shelter"]],"sr":["temp_pools","tussocks","deadwood"]},{"id":"grasf","g":"amphibians","de":"Grasfrosch","en":"Common frog","la":"Rana temporaria","m":[2,10],"st":{"en":"Specially protected","de":"Besonders geschützt"},"tx":{"en":"Spawns early in shallow, sunny water, including temporary pools. Adults spend the summer in damp meadows and tall herbs and overwinter in mud or under deadwood.","de":"Laicht früh in flachem, sonnigem Wasser, auch in temporären Tümpeln. Die Alttiere verbringen den Sommer in feuchten Wiesen und Hochstauden und überwintern im Schlamm oder unter Totholz."},"pl":[["filipendula","shelter"],["deschampsia","shelter"]],"sr":["temp_pools","deadwood","unmown"]},{"id":"erdk","g":"amphibians","de":"Erdkröte","en":"Common toad","la":"Bufo bufo","m":[3,10],"st":{"en":"Specially protected","de":"Besonders geschützt"},"tx":{"en":"Returns every spring to its home pond, often a deeper one with fish, which avoid its toxic tadpoles. It wraps its spawn strings around upright stems and spends the rest of the year in scrub and woodland edges.","de":"Kehrt jedes Frühjahr zu ihrem Heimatgewässer zurück, oft einem tieferen Teich mit Fischen, die ihre giftigen Kaulquappen meiden. Wickelt ihre Laichschnüre um senkrechte Stängel und lebt den Rest des Jahres in Gebüschen und an Waldrändern."},"pl":[["schoenoplectus","shelter"],["sparganium","shelter"]],"sr":["deep_water","deadwood","dense_scrub"]},{"id":"teichm","g":"amphibians","de":"Teichmolch","en":"Smooth newt","la":"Lissotriton vulgaris","m":[3,9],"st":{"en":"Specially protected","de":"Besonders geschützt"},"tx":{"en":"Breeds in fish-free ponds with plenty of underwater plants; females wrap each egg in a folded leaf. On land it hides under deadwood and stones.","de":"Pflanzt sich in fischfreien Teichen mit vielen Unterwasserpflanzen fort; die Weibchen wickeln jedes Ei in ein gefaltetes Blatt. An Land versteckt er sich unter Totholz und Steinen."},"pl":[["myosotis","shelter"],["veronica_b","shelter"]],"sr":["temp_pools","stone_pile","deadwood"]},{"id":"ringel","g":"reptiles","de":"Ringelnatter","en":"Grass snake","la":"Natrix natrix","m":[4,10],"st":{"en":"Specially protected","de":"Besonders geschützt"},"tx":{"en":"A harmless swimmer that hunts frogs, toads and small fish along ditches and ponds. It lays its eggs in warm, rotting heaps of compost, reed or leaves and suns itself on open banks.","de":"Harmlose Schwimmerin, die an Gräben und Teichen Frösche, Kröten und kleine Fische jagt. Legt ihre Eier in warme, verrottende Kompost-, Schilf- oder Laubhaufen und sonnt sich auf offenen Böschungen."},"pl":[["phragmites","shelter"]],"sr":["compost_heap","stone_pile","reed_stand"]},{"id":"zaun","g":"reptiles","de":"Zauneidechse","en":"Sand lizard","la":"Lacerta agilis","m":[4,9],"st":{"en":"Strictly protected (FFH Annex IV)","de":"Streng geschützt (FFH-Anhang IV)"},"tx":{"en":"Lives on sunny Geest slopes with a mosaic of low vegetation, cover and open sand, where it lays its eggs. Stone and brush piles provide basking spots and shelter.","de":"Lebt an sonnigen Geesthängen mit einem Mosaik aus niedriger Vegetation, Deckung und offenem Sand, in den sie ihre Eier legt. Stein- und Reisighaufen dienen als Sonnenplatz und Versteck."},"pl":[["festuca_rubra","shelter"]],"sr":["open_sand","stone_pile","deadwood"]},{"id":"teichr","g":"birds","de":"Teichrohrsänger","en":"Reed warbler","la":"Acrocephalus scirpaceus","m":[4,9],"st":{"en":"Protected (all European birds)","de":"Geschützt (alle europäischen Vogelarten)"},"tx":{"en":"Weaves its nest between upright reed stems over water. It needs reed beds that are not cut every year.","de":"Flicht sein Nest zwischen senkrechte Schilfhalme über dem Wasser. Braucht Röhrichte, die nicht jedes Jahr geschnitten werden."},"pl":[["phragmites","shelter"],["typha","shelter"]],"sr":["reed_stand"]},{"id":"sumpfr","g":"birds","de":"Sumpfrohrsänger","en":"Marsh warbler","la":"Acrocephalus palustris","m":[5,8],"st":{"en":"Protected (all European birds)","de":"Geschützt (alle europäischen Vogelarten)"},"tx":{"en":"Nests in tall herbs such as meadowsweet, loosestrife and nettles rather than in reed. It arrives late in May, so tall-herb stands must not be mown in early summer.","de":"Nistet in Hochstauden wie Mädesüß, Weiderich und Brennnesseln statt im Schilf. Kommt erst Ende Mai an – Hochstaudenfluren dürfen im Frühsommer nicht gemäht werden."},"pl":[["filipendula","shelter"],["lythrum","shelter"]],"sr":["unmown","nettle"]},{"id":"rohramm","g":"birds","de":"Rohrammer","en":"Reed bunting","la":"Emberiza schoeniclus","m":[1,12],"st":{"en":"Protected (all European birds)","de":"Geschützt (alle europäischen Vogelarten)"},"tx":{"en":"Breeds in reeds, sedges and tall herbs, often near willow scrub. In winter it feeds on seeds from standing reed, rushes and herbs.","de":"Brütet in Röhricht, Seggen und Hochstauden, oft nahe Weidengebüsch. Im Winter frisst sie Samen aus stehendem Schilf, Binsen und Stauden."},"pl":[["phragmites","seeds"],["carex_acuta","shelter"],["juncus_eff","seeds"],["salix_cin","shelter"]],"sr":["reed_stand","seedheads"]},{"id":"blauk","g":"birds","de":"Blaukehlchen","en":"Bluethroat","la":"Luscinia svecica","m":[4,8],"st":{"en":"EU Birds Directive, Annex I","de":"EU-Vogelschutzrichtlinie, Anhang I"},"tx":{"en":"Breeds where reed edges meet open, muddy ground, often along Marsch ditches. It forages on bare mud, so ditches with gently sloping, partly open banks suit it.","de":"Brütet dort, wo Röhrichtränder an offenen, schlammigen Boden grenzen, oft an Marschgräben. Sucht Nahrung auf offenem Schlamm – Gräben mit flachen, teils offenen Ufern passen gut."},"pl":[["phragmites","shelter"]],"sr":["mud","reed_stand"]},{"id":"teichh","g":"birds","de":"Teichhuhn","en":"Moorhen","la":"Gallinula chloropus","m":[1,12],"st":{"en":"Protected (all European birds)","de":"Geschützt (alle europäischen Vogelarten)"},"tx":{"en":"Breeds on almost any pond with vegetated banks, even small urban ones. It builds its nest in emergent plants or under overhanging branches.","de":"Brütet an fast jedem Teich mit bewachsenen Ufern, auch an kleinen Stadtgewässern. Baut sein Nest im Röhricht oder unter überhängenden Ästen."},"pl":[["typha","shelter"],["sparganium","shelter"],["iris","shelter"]],"sr":["reed_stand"]},{"id":"storch","g":"birds","de":"Weißstorch","en":"White stork","la":"Ciconia ciconia","m":[3,8],"st":{"en":"Strictly protected","de":"Streng geschützt"},"tx":{"en":"Forages in wet meadows and along ditches for frogs, insects, worms and mice. In Hamburg it breeds mainly in the Vier- und Marschlande.","de":"Sucht in Feuchtwiesen und an Gräben nach Fröschen, Insekten, Würmern und Mäusen. In Hamburg brütet er vor allem in den Vier- und Marschlanden."},"pl":[],"sr":["mud","temp_pools"]},{"id":"stieg","g":"birds","de":"Stieglitz","en":"Goldfinch","la":"Carduelis carduelis","m":[1,12],"st":{"en":"Protected (all European birds)","de":"Geschützt (alle europäischen Vogelarten)"},"tx":{"en":"Feeds on the seeds of thistles, knapweed and other composites. Seed heads left standing into winter keep it fed.","de":"Frisst die Samen von Disteln, Flockenblumen und anderen Korbblütlern. Über Winter stehende Samenstände sichern sein Futter."},"pl":[["cirsium_pal","seeds"],["centaurea","seeds"],["hypochaeris","seeds"]],"sr":["seedheads"]},{"id":"nacht","g":"birds","de":"Nachtigall","en":"Nightingale","la":"Luscinia megarhynchos","m":[4,8],"st":{"en":"Protected (all European birds)","de":"Geschützt (alle europäischen Vogelarten)"},"tx":{"en":"Sings at night from dense, damp thickets. It nests on or near the ground under shrubs where leaf litter is left lying.","de":"Singt nachts aus dichten, feuchten Gebüschen. Nistet am oder nahe dem Boden unter Sträuchern, wo Falllaub liegen bleibt."},"pl":[["salix_cin","shelter"],["frangula","shelter"],["viburnum","shelter"]],"sr":["dense_scrub"]},{"id":"eisv","g":"birds","de":"Eisvogel","en":"Kingfisher","la":"Alcedo atthis","m":[1,12],"st":{"en":"Strictly protected; EU Birds Directive, Annex I","de":"Streng geschützt; EU-Vogelschutzrichtlinie, Anhang I"},"tx":{"en":"Hunts small fish from perches over clear water. It digs its nesting tunnel into steep, bare earth banks, so it needs larger water bodies with such banks nearby.","de":"Jagt kleine Fische von Ansitzen über klarem Wasser. Gräbt seine Brutröhre in steile, unbewachsene Erdwände – braucht größere Gewässer mit solchen Uferabbrüchen in der Nähe."},"pl":[["salix_alba","shelter"],["alnus","shelter"]],"sr":["perches","steep_bank"]},{"id":"wasserfl","g":"bats","de":"Wasserfledermaus","en":"Daubenton's bat","la":"Myotis daubentonii","m":[4,10],"st":{"en":"Strictly protected (FFH Annex IV)","de":"Streng geschützt (FFH-Anhang IV)"},"tx":{"en":"Skims low over calm water, catching midges and caddisflies, sometimes straight off the surface. It roosts in tree cavities near water, such as old willows and alders.","de":"Jagt dicht über ruhigem Wasser Zuckmücken und Köcherfliegen, teils direkt von der Oberfläche. Quartiere in Baumhöhlen nahe am Wasser, etwa in alten Weiden und Erlen."},"pl":[["salix_alba","shelter"],["alnus","shelter"]],"sr":["pollards","open_water"]},{"id":"sumpfs","g":"insects","de":"Sumpfschrecke","en":"Large marsh grasshopper","la":"Stethophyma grossum","m":[7,10],"st":{"en":"Red-listed; indicator of intact wet meadows","de":"Rote Liste; Zeiger intakter Feuchtwiesen"},"tx":{"en":"A large grasshopper of wet meadows and sedge fens with high groundwater. Its eggs need permanently moist soil, so it disappears when sites are drained.","de":"Große Heuschrecke nasser Wiesen und Seggenriede mit hohem Grundwasserstand. Ihre Eier brauchen dauerhaft feuchten Boden – bei Entwässerung verschwindet sie."},"pl":[["carex_acuta","shelter"],["juncus_eff","shelter"],["deschampsia","shelter"]],"sr":["tussocks","unmown"]},{"id":"moschus","g":"insects","de":"Moschusbock","en":"Musk beetle","la":"Aromia moschata","m":[6,8],"st":{"en":"Depends on old willows","de":"Auf alte Weiden angewiesen"},"tx":{"en":"A metallic-green longhorn beetle whose larvae develop for years in the wood of old, living willows, especially pollards. Adults smell of musk and visit umbels.","de":"Metallisch grüner Bockkäfer, dessen Larven jahrelang im Holz alter, lebender Weiden reifen, besonders in Kopfweiden. Die Käfer duften nach Moschus und besuchen Doldenblüten."},"pl":[["salix_alba","host"],["salix_vim","host"],["angelica","nectar"],["daucus","nectar"]],"sr":["pollards"]},{"id":"schlamm","g":"fish","de":"Schlammpeitzger","en":"Weatherfish","la":"Misgurnus fossilis","m":[1,12],"st":{"en":"FFH Annex II; highly endangered","de":"FFH-Anhang II; stark gefährdet"},"tx":{"en":"A loach of muddy, plant-rich ditches that survives low oxygen by gulping air and burying itself in the mud. Clearing whole ditches at once destroys populations, so maintain them in sections.","de":"Ein Vertreter der Steinbeißer, der in schlammigen, pflanzenreichen Gräben lebt und Sauerstoffmangel durch Luftschlucken und Eingraben im Schlamm übersteht. Die Räumung ganzer Gräben auf einmal vernichtet Bestände – deshalb abschnittsweise pflegen."},"pl":[["persicaria","shelter"],["sagittaria","shelter"]],"sr":["mud","sectional_care"]}],"groups":{"bees":{"en":"Wild bees","de":"Wildbienen"},"butterflies":{"en":"Butterflies","de":"Tagfalter"},"dragonflies":{"en":"Dragonflies","de":"Libellen"},"amphibians":{"en":"Amphibians","de":"Amphibien"},"reptiles":{"en":"Reptiles","de":"Reptilien"},"birds":{"en":"Birds","de":"Vögel"},"bats":{"en":"Bats","de":"Fledermäuse"},"insects":{"en":"Other insects","de":"Weitere Insekten"},"fish":{"en":"Fish","de":"Fische"}},"roles":{"pollen":{"en":"Pollen for larvae","de":"Pollen für die Brut"},"host":{"en":"Larval food plant","de":"Raupen- bzw. Larvenfutter"},"nectar":{"en":"Nectar","de":"Nektar"},"shelter":{"en":"Shelter, perch or nest","de":"Deckung, Ansitz oder Nest"},"seeds":{"en":"Seeds & fruit","de":"Samen & Früchte"}},"struct":{"open_sand":{"en":"Open sand patches","de":"Offene Sandstellen","wen":"South-facing rim or slope, 1–5 m², kept free of vegetation","wde":"Südexponierter Rand oder Hang, 1–5 m², vegetationsfrei gehalten"},"standing_stems":{"en":"Dead stems left standing over winter","de":"Stehende Altstängel über Winter","wen":"Tall-herb and meadow areas; cut back in spring instead of autumn","wde":"Hochstauden- und Wiesenflächen; im Frühjahr statt im Herbst zurückschneiden"},"deadwood":{"en":"Deadwood & brush piles","de":"Totholz- & Reisighaufen","wen":"Edges in part sun, partly lying in damp ground","wde":"Ränder im Halbschatten, teils im feuchten Boden liegend"},"stone_pile":{"en":"Stone piles","de":"Steinhaufen","wen":"Sunny slope near water, with a frost-free core below ground","wde":"Sonniger Hang nahe dem Wasser, mit frostfreiem Kern im Boden"},"temp_pools":{"en":"Temporary, fish-free pools","de":"Temporäre, fischfreie Kleingewässer","wen":"Hollows in the swale floor that hold water for weeks in spring","wde":"Senken in der Muldensohle, die im Frühjahr wochenlang Wasser halten"},"shallow_shelf":{"en":"Sunny shallow-water shelves","de":"Sonnige Flachwasserzonen","wen":"South and west banks of ponds, 0–30 cm deep","wde":"Süd- und Westufer von Teichen, 0–30 cm tief"},"reed_stand":{"en":"Old reed stands","de":"Altschilfbestände","wen":"Reed belts left uncut for several years","wde":"Röhrichte, die mehrere Jahre ungemäht bleiben"},"tussocks":{"en":"Grass and sedge tussocks","de":"Gras- und Seggenbulten","wen":"Tall-sedge and wet-meadow areas","wde":"Großseggen- und Feuchtwiesenbereiche"},"unmown":{"en":"Unmown refuge strips","de":"Ungemähte Rückzugsstreifen","wen":"10–30 % of each meadow, in a different place every year","wde":"10–30 % jeder Wiese, jedes Jahr an anderer Stelle"},"pollards":{"en":"Pollard willows & tree cavities","de":"Kopfweiden & Baumhöhlen","wen":"Willow rows along ditches; old alders at the water","wde":"Weidenreihen an Gräben; alte Erlen am Wasser"},"steep_bank":{"en":"Steep earth banks","de":"Steile Erdufer","wen":"Bare, vertical earth bank on larger water bodies","wde":"Unbewachsene, senkrechte Erdwand an größeren Gewässern"},"compost_heap":{"en":"Compost, leaf or reed heaps","de":"Kompost-, Laub- oder Schilfhaufen","wen":"Sunny corner near the water, topped up every year","wde":"Sonnige Ecke nahe dem Wasser, jährlich ergänzt"},"mud":{"en":"Open mud & muddy banks","de":"Offener Schlamm & schlammige Ufer","wen":"Gently sloping banks that fall dry in summer","wde":"Flache Ufer, die im Sommer trockenfallen"},"dense_scrub":{"en":"Dense scrub with leaf litter","de":"Dichtes Gebüsch mit Falllaub","wen":"Willow and buckthorn thickets where leaves are left lying","wde":"Weiden- und Faulbaumdickichte, in denen das Laub liegen bleibt"},"perches":{"en":"Perches over the water","de":"Ansitzwarten über dem Wasser","wen":"Branches, stakes or tall stems above the water surface","wde":"Äste, Pfähle oder hohe Stängel über der Wasserfläche"},"nettle":{"en":"A patch of stinging nettles","de":"Ein Brennnesselbestand","wen":"A small patch at a sunny rim","wde":"Ein kleiner Bestand an einem sonnigen Rand"},"seedheads":{"en":"Seed heads left standing","de":"Stehen gelassene Samenstände","wen":"Thistles, knapweed and umbellifers left over winter","wde":"Disteln, Flockenblumen und Doldenblütler über Winter stehen lassen"},"deep_water":{"en":"Deeper water that doesn't freeze solid","de":"Tiefere Bereiche, die nicht durchfrieren","wen":"Part of the pond deeper than about 80 cm","wde":"Teil des Teichs tiefer als etwa 80 cm"},"open_water":{"en":"Calm, open water surface","de":"Ruhige, offene Wasserfläche","wen":"Unshaded open water","wde":"Unbeschattete offene Wasserfläche"},"sectional_care":{"en":"Maintenance in sections","de":"Abschnittsweise Pflege","wen":"Ditches and reed belts: never maintain everything in the same year","wde":"Gräben und Röhrichte: nie alles im selben Jahr pflegen"}},"biotopes":[{"id":"flutrasen","n":{"en":"Flood sward","de":"Flutrasen"},"al":{"en":"Potentillion anserinae","de":"Potentillion anserinae"},"wh":{"en":"Lowest, often compacted parts of the swale floor, inflow areas and trampled hollows.","de":"Tiefste, oft verdichtete Teile der Muldensohle, Zulaufbereiche und betretene Senken."},"rg":{"en":"Flooded often but briefly; dries out hard in summer.","de":"Häufig, aber kurz überstaut; trocknet im Sommer stark aus."},"so":"both","d":{"en":"A low, tough carpet of creeping grasses and rosette plants that survives repeated flooding, trampling and drought. It is the workhorse of the swale floor: it closes quickly, filters runoff and needs little care.","de":"Ein niedriger, robuster Teppich aus kriechenden Gräsern und Rosettenpflanzen, der wiederholte Überflutung, Tritt und Trockenheit übersteht. Das Arbeitstier der Muldensohle: schließt schnell, filtert den Abfluss und braucht wenig Pflege."},"core":["agrostis_st","potentilla","juncus_art","carex_hirta","ranunculus_fl","alopecurus"],"comp":["lotus_ped","juncus_eff","mentha","deschampsia","juncus_inf"],"fauna":["storch","grasf","moorf","plattb","bombus"],"sr":["temp_pools","mud"],"care":{"en":"Mow once or twice a year, or let it take light trampling. Remove sediment at the inflow when it builds up.","de":"Ein- bis zweimal jährlich mähen oder leichten Tritt zulassen. Sediment am Zulauf entfernen, sobald es sich ansammelt."},"veg":"low"},{"id":"feuchtwiese","n":{"en":"Alternately wet meadow","de":"Wechselfeuchte Wiese"},"al":{"en":"Calthion palustris / Molinietalia","de":"Calthion palustris / Molinietalia"},"wh":{"en":"Swale slopes and broad, flat basin floors with lean soil.","de":"Muldenböschungen und breite, flache Beckensohlen mit magerem Boden."},"rg":{"en":"Wet in winter and after rain, dry in late summer: the essence of wechselfeucht.","de":"Im Winter und nach Regen nass, im Spätsommer trocken – der Inbegriff von wechselfeucht."},"so":"both","d":{"en":"The most colourful community: ragged-robin, devil's-bit and marsh thistle in a matrix of tufted hair-grass. It stays species-rich only on lean soil with regular mowing and the cuttings removed.","de":"Die bunteste Gesellschaft: Kuckucks-Lichtnelke, Teufelsabbiss und Sumpf-Kratzdistel in einer Matrix aus Rasen-Schmiele. Bleibt nur auf magerem Boden mit regelmäßiger Mahd und Abräumen artenreich."},"core":["deschampsia","silene_fc","succisa","cardamine","lotus_ped","cirsium_pal","caltha","alopecurus"],"comp":["centaurea","lathyrus","vicia","juncus_eff","carex_hirta","filipendula","anthoxanthum"],"fauna":["aurora","icarus","sumpfs","storch","moorf","bombus","stieg","ochsen"],"sr":["unmown","standing_stems"],"care":{"en":"Mow twice (June/July and September) and remove the cuttings. Leave 10–20 % unmown in rotation. Never fertilise.","de":"Zweimal mähen (Juni/Juli und September), Mähgut abräumen. 10–20 % im Wechsel stehen lassen. Niemals düngen."},"veg":"meadow"},{"id":"hochstauden","n":{"en":"Meadowsweet tall-herb fen","de":"Mädesüß-Hochstaudenflur"},"al":{"en":"Filipendulion ulmariae","de":"Filipendulion ulmariae"},"wh":{"en":"Lower swale slopes, ditch banks and berms that are mown only every one to three years.","de":"Untere Muldenböschungen, Grabenufer und Bermen, die nur alle ein bis drei Jahre gemäht werden."},"rg":{"en":"Moist to wet, flooded for days after heavy rain, rarely dry for long.","de":"Feucht bis nass, nach Starkregen tagelang überstaut, selten lange trocken."},"so":"both","d":{"en":"Head-high stands of meadowsweet, loosestrife and valerian that flower from June to September. Two specialist bees depend on them, and their hollow stems shelter insects through winter.","de":"Mannshohe Bestände aus Mädesüß, Weiderich und Baldrian, die von Juni bis September blühen. Zwei spezialisierte Wildbienen sind auf sie angewiesen, und ihre hohlen Stängel bieten Insekten ein Winterquartier."},"core":["filipendula","lythrum","lysimachia","valeriana","eupatorium","angelica","stachys"],"comp":["lycopus","symphytum","iris","cirsium_pal","mentha","galium_pal","carex_acf"],"fauna":["melitta","macropis","sumpfr","pfau","bombus","moschus","hylaeus","zitron","grasf"],"sr":["standing_stems","unmown","nettle"],"care":{"en":"Mow every 1–3 years in September or October, in rotating sections, to keep scrub out. Leave stems standing over winter.","de":"Alle 1–3 Jahre im September oder Oktober abschnittsweise mähen, damit keine Gehölze aufkommen. Stängel über Winter stehen lassen."},"veg":"tall"},{"id":"grossseggen","n":{"en":"Tall-sedge swamp","de":"Großseggenried"},"al":{"en":"Magnocaricion elatae","de":"Magnocaricion elatae"},"wh":{"en":"Shores and basin floors that stay flooded for weeks, pond margins and wet ditch bottoms.","de":"Ufer und Beckensohlen, die wochenlang überstaut bleiben, Teichränder und nasse Grabensohlen."},"rg":{"en":"Flooded for weeks in winter and spring, often wet into summer.","de":"Im Winter und Frühjahr wochenlang überstaut, oft bis in den Sommer nass."},"so":"both","d":{"en":"Dense stands and sculptural tussocks of large sedges, with yellow iris and yellow loosestrife between them. The tussocks are dry islands in the water, used by frogs, spiders and grasshoppers.","de":"Dichte Bestände und skulpturale Bulten großer Seggen, mit Sumpf-Schwertlilie und Gilbweiderich dazwischen. Die Bulten sind trockene Inseln im Wasser, genutzt von Fröschen, Spinnen und Heuschrecken."},"core":["carex_acuta","carex_elata","carex_pan","iris","galium_pal","lysimachia"],"comp":["lythrum","lycopus","mentha","caltha","juncus_eff","carex_acf","phalaris"],"fauna":["moorf","rohramm","sumpfs","vierfl","teichm","grasf"],"sr":["tussocks","deadwood"],"care":{"en":"Cut every 2–5 years in late autumn, or leave small areas uncut. Keep old tussocks.","de":"Alle 2–5 Jahre im Spätherbst mähen oder kleine Flächen ganz ungemäht lassen. Alte Bulten erhalten."},"veg":"sedge"},{"id":"roehricht","n":{"en":"Reed belt & shallow water","de":"Röhricht & Flachwasser"},"al":{"en":"Phragmition australis","de":"Phragmition australis"},"wh":{"en":"Permanently wet margins of retention ponds and ditches, water depth 0–40 cm.","de":"Dauerhaft nasse Ränder von Retentionsteichen und Gräben, Wassertiefe 0–40 cm."},"rg":{"en":"Permanently wet; the water level rises and falls by several decimetres.","de":"Dauerhaft nass; der Wasserstand schwankt um mehrere Dezimeter."},"so":"both","d":{"en":"Reed, club-rush and bur-reed form a tall belt that brakes inflowing water, takes up nutrients and holds the bank. It is the core habitat of reed warblers and many dragonflies.","de":"Schilf, Teichsimse und Igelkolben bilden einen hohen Gürtel, der einströmendes Wasser bremst, Nährstoffe aufnimmt und das Ufer hält. Kernlebensraum für Rohrsänger und viele Libellen."},"core":["phragmites","typha","schoenoplectus","sparganium","iris","lycopus","mentha"],"comp":["lythrum","caltha","myosotis","carex_pan","alisma","phalaris"],"fauna":["teichr","rohramm","blauk","teichh","mosaik","vierfl","ringel","erdk","azur"],"sr":["shallow_shelf","reed_stand","compost_heap"],"care":{"en":"Cut reed only in winter (October to February) and in sections, at most about a third per year. Limit spreading species in small basins.","de":"Röhricht nur im Winter (Oktober bis Februar) und abschnittsweise schneiden, höchstens etwa ein Drittel pro Jahr. Wuchernde Arten in kleinen Becken begrenzen."},"veg":"reed"},{"id":"offenwasser","n":{"en":"Open ditch & pond water","de":"Offenes Graben- & Teichwasser"},"al":{"en":"Floating-leaf & low emergent vegetation","de":"Schwimmblatt- & Kleinröhrichtvegetation"},"wh":{"en":"Open water of retention ponds and Marsch ditches, with a shallow shelf and a deeper zone.","de":"Offene Wasserfläche von Retentionsteichen und Marschgräben, mit Flachwasserzone und tieferem Bereich."},"rg":{"en":"Permanent water, or water that dries out only in late summer.","de":"Dauerwasser oder Wasser, das erst im Spätsommer trockenfällt."},"so":"both","d":{"en":"Flowering-rush, arrowhead and amphibious bistort grow from the shallows into open water. Varied depths, sun and no fish stocking make it a nursery for dragonflies, newts and frogs.","de":"Schwanenblume, Pfeilkraut und Wasser-Knöterich wachsen vom Flachwasser in die offene Fläche. Wechselnde Tiefen, Sonne und kein Fischbesatz machen sie zur Kinderstube für Libellen, Molche und Frösche."},"core":["butomus","sagittaria","alisma","persicaria","veronica_b","myosotis"],"comp":["sparganium","mentha","caltha","menyanthes","schoenoplectus","iris"],"fauna":["schlamm","pracht","azur","plattb","teichm","grasf","erdk","eisv","teichh","wasserfl","ringel","storch","moorf"],"sr":["shallow_shelf","open_water","deep_water","sectional_care"],"care":{"en":"Clear ditches in October or November, in sections and from one side only. Leave dredged material on the bank for a day or two so animals can crawl back.","de":"Gräben im Oktober oder November abschnittsweise und nur von einer Seite räumen. Räumgut ein bis zwei Tage am Ufer liegen lassen, damit Tiere zurück ins Wasser gelangen."},"veg":"water"},{"id":"weiden","n":{"en":"Willow scrub & alder fringe","de":"Weidengebüsch & Erlensaum"},"al":{"en":"Salicion cinereae / Alnion glutinosae","de":"Salicion cinereae / Alnion glutinosae"},"wh":{"en":"Basin edges and ditch banks outside the flow line, ideally on the north or east side so the water stays sunny.","de":"Beckenränder und Grabenufer außerhalb der Fließstrecke, möglichst auf der Nord- oder Ostseite, damit das Wasser besonnt bleibt."},"rg":{"en":"Waterlogged to periodically flooded; alder and willow survive months of standing water.","de":"Staunass bis zeitweise überflutet; Erle und Weide überstehen monatelang stehendes Wasser."},"so":"both","d":{"en":"Willows flower in March and feed the first wild bees of the year. Coppiced or pollarded, they create cavities, deadwood and dense cover for nightingales, bats and the musk beetle.","de":"Weiden blühen im März und ernähren die ersten Wildbienen des Jahres. Auf den Stock gesetzt oder als Kopfweide geschnitten, entstehen Höhlen, Totholz und dichte Deckung für Nachtigall, Fledermäuse und Moschusbock."},"core":["salix_cin","salix_aur","salix_pur","frangula","viburnum","alnus"],"comp":["salix_vim","salix_tri","salix_alba","prunus_padus","carex_pan","filipendula","myrica","betula_pub","ulmus","quercus","cornus","sambucus"],"fauna":["andvaga","zitron","nacht","rohramm","wasserfl","moschus","mosaik","eisv"],"sr":["pollards","deadwood","dense_scrub"],"care":{"en":"Coppice willows in sections every 3–5 years and re-cut pollards every 5–8 years, only between October and February (§ 39 BNatSchG).","de":"Weiden abschnittsweise alle 3–5 Jahre auf den Stock setzen, Kopfweiden alle 5–8 Jahre schneiden – nur von Oktober bis Februar (§ 39 BNatSchG)."},"veg":"woody"},{"id":"magerrasen","n":{"en":"Lean grassland bank (Geest)","de":"Magerrasen-Böschung (Geest)"},"al":{"en":"Sand grassland / lean hay meadow","de":"Sandmagerrasen / magere Glatthaferwiese"},"wh":{"en":"Upper slopes and rims on sandy Geest soils, sunny and well drained.","de":"Oberhänge und Ränder auf sandigen Geestböden, sonnig und durchlässig."},"rg":{"en":"Rarely or never flooded; dry and hot in summer.","de":"Selten oder nie überstaut; im Sommer trocken und heiß."},"so":"geest","d":{"en":"Fine grasses with harebell, cat's-ear and bird's-foot-trefoil on lean sand. Open sand patches turn this bank into nesting ground for wild bees and the sand lizard.","de":"Feine Gräser mit Glockenblume, Ferkelkraut und Hornklee auf magerem Sand. Offene Sandstellen machen die Böschung zum Nistplatz für Wildbienen und Zauneidechse."},"core":["festuca_rubra","agrostis_cap","anthoxanthum","hypochaeris","campanula_rot","galium_ver","achillea","lotus_cor"],"comp":["knautia","centaurea","daucus","leucanthemum","plantago","vicia"],"fauna":["andhatt","chelo","andvaga","icarus","ochsen","zaun","schwalb","stieg","bombus","hylaeus"],"sr":["open_sand","stone_pile","seedheads"],"care":{"en":"Mow once or twice and remove the cuttings; leave 10–20 % uncut. Scrape a few sand patches open again every few years.","de":"Ein- bis zweimal mähen und abräumen; 10–20 % stehen lassen. Einzelne Sandstellen alle paar Jahre wieder freilegen."},"veg":"dry"}],"invasive":[{"de":"Drüsiges Springkraut","en":"Himalayan balsam","la":"Impatiens glandulifera","p":{"en":"Invasive annual along Hamburg's watercourses; forms dense stands and leaves banks bare and erodible in winter.","de":"Invasive Einjährige an Hamburgs Gewässern; bildet dichte Bestände und hinterlässt im Winter kahle, erosionsanfällige Ufer."},"a":{"en":"Pull it before it sets seed (by July) and check every year.","de":"Vor der Samenreife (bis Juli) ausreißen und jedes Jahr kontrollieren."}},{"de":"Japanischer Staudenknöterich","en":"Japanese knotweed","la":"Reynoutria japonica","p":{"en":"Extremely persistent rhizomes; spreads with moved soil and fragments.","de":"Extrem hartnäckige Rhizome; verbreitet sich mit verlagertem Boden und Bruchstücken."},"a":{"en":"Never bring in soil of unknown origin; have existing stands managed professionally.","de":"Nie Boden unbekannter Herkunft einbauen; bestehende Bestände fachgerecht bekämpfen lassen."}},{"de":"Sachalin- & Bastard-Staudenknöterich","en":"Giant & Bohemian knotweed","la":"Reynoutria sachalinensis, R. × bohemica","p":{"en":"As above; the hybrid is the most vigorous.","de":"Wie oben; der Hybrid ist am wüchsigsten."},"a":{"en":"As above.","de":"Wie oben."}},{"de":"Kanadische Goldrute","en":"Canadian goldenrod","la":"Solidago canadensis","p":{"en":"Forms monocultures in fallow, drying swales and on rims.","de":"Bildet Dominanzbestände in brachliegenden, abtrocknenden Mulden und an Rändern."},"a":{"en":"Mow twice a year before flowering (about June and August).","de":"Zweimal jährlich vor der Blüte mähen (etwa Juni und August)."}},{"de":"Riesen-Goldrute","en":"Giant goldenrod","la":"Solidago gigantea","p":{"en":"Prefers wetter ground than Canadian goldenrod, so it is typical in swales and on ditch banks.","de":"Bevorzugt feuchtere Böden als die Kanadische Goldrute – typisch in Mulden und an Grabenufern."},"a":{"en":"As above.","de":"Wie oben."}},{"de":"Riesen-Bärenklau","en":"Giant hogweed","la":"Heracleum mantegazzianum","p":{"en":"EU-listed invasive; its sap causes severe skin burns in sunlight.","de":"Invasive Art der EU-Unionsliste; der Pflanzensaft verursacht im Sonnenlicht schwere Hautverbrennungen."},"a":{"en":"Remove only in full protective clothing; report larger stands.","de":"Nur in voller Schutzkleidung entfernen; größere Bestände melden."}},{"de":"Späte Traubenkirsche","en":"Black cherry","la":"Prunus serotina","p":{"en":"Invades sandy Geest woods and heath edges.","de":"Dringt in sandige Geestwälder und Heideränder ein."},"a":{"en":"Pull seedlings; don't confuse it with the native bird cherry.","de":"Sämlinge ausreißen; nicht mit der heimischen Gewöhnlichen Traubenkirsche verwechseln."}},{"de":"Nuttalls Wasserpest","en":"Nuttall's waterweed","la":"Elodea nuttallii","p":{"en":"EU-listed invasive aquatic; overgrows ponds and ditches.","de":"Invasive Wasserpflanze der EU-Unionsliste; überwuchert Teiche und Gräben."},"a":{"en":"Never introduce it with pond plants; check every delivery.","de":"Nie mit Teichpflanzen einschleppen; jede Lieferung kontrollieren."}},{"de":"Großblütiges Heusenkraut","en":"Water primrose","la":"Ludwigia grandiflora","p":{"en":"EU-listed invasive aquatic; chokes shallow water bodies and is spreading in north-west Germany.","de":"Invasive Wasserpflanze der EU-Unionsliste; überwuchert Flachgewässer und breitet sich in Nordwestdeutschland aus."},"a":{"en":"Never plant it; report finds to the nature conservation authority.","de":"Nie pflanzen; Funde der Naturschutzbehörde melden."}},{"de":"Gewöhnliche Esche (Vorsicht)","en":"Common ash (caution)","la":"Fraxinus excelsior","p":{"en":"Native, but ash dieback kills most trees.","de":"Heimisch, aber das Eschentriebsterben lässt die meisten Bäume absterben."},"a":{"en":"Don't rely on it as a key tree; use European white elm, pedunculate oak or black alder.","de":"Nicht als Leitbaum einplanen; stattdessen Flatter-Ulme, Stiel-Eiche oder Schwarz-Erle."}}],"guide":[{"id":"regimes","en_t":"Wechselfeucht in three states","de_t":"Wechselfeucht in drei Zuständen","en":"<p>A swale or retention basin is not one habitat but a sequence of wet and dry phases. Plan every planting zone for all three states:<\/p>\n<ul>\n<li><b>Dry summer.<\/b> Weeks without rain. The swale floor cracks and only permanent water remains.<\/li>\n<li><b>Winter, high groundwater.<\/b> Soils stay saturated for weeks. In the Marsch the groundwater can come close to the surface.<\/li>\n<li><b>After heavy rain.<\/b> The basin fills for hours to days. In infiltration swales the ponding is limited to about 30 cm.<\/li>\n<\/ul>\n<p>Plants on the swale floor must survive both extremes. That is why the palette leans on wechselfeuchte species such as tufted hair-grass, purple loosestrife and yellow iris rather than on pure wetland or pure meadow plants.<\/p>","de":"<p>Eine Mulde oder ein Retentionsbecken ist kein einzelner Lebensraum, sondern eine Abfolge nasser und trockener Phasen. Plane jede Pflanzzone für alle drei Zustände:<\/p>\n<ul>\n<li><b>Trockener Sommer.<\/b> Wochen ohne Regen. Die Muldensohle reißt auf, nur das Dauerwasser bleibt.<\/li>\n<li><b>Winter, hoher Grundwasserstand.<\/b> Die Böden sind wochenlang wassergesättigt. In der Marsch kann das Grundwasser bis nah an die Oberfläche steigen.<\/li>\n<li><b>Nach Starkregen.<\/b> Das Becken füllt sich für Stunden bis Tage. In Versickerungsmulden ist der Einstau auf etwa 30 cm begrenzt.<\/li>\n<\/ul>\n<p>Pflanzen der Muldensohle müssen beide Extreme überstehen. Deshalb setzt die Palette auf wechselfeuchte Arten wie Rasen-Schmiele, Blut-Weiderich und Sumpf-Schwertlilie statt auf reine Sumpf- oder reine Wiesenpflanzen.<\/p>","action":"crosssection"},{"id":"types","en_t":"Choose the system","de_t":"Das passende System","en":"<p>The system type sets how long water stands, and that decides which biotopes can grow. Typical combinations:<\/p>","de":"<p>Der Anlagentyp bestimmt, wie lange Wasser steht – und damit, welche Biotope wachsen können. Typische Kombinationen:<\/p>","table":"types"},{"id":"site","en_t":"Read the site: Geest or Marsch","de_t":"Den Standort lesen: Geest oder Marsch","en":"<div class=\"duo\">\n<div class=\"duo-card geest\"><h4>Geest<\/h4><p>Sandy, acidic and often nutrient-poor. Groundwater is usually deep and infiltration works well, so infiltration swales and swale–trench systems are the default.<\/p><p class=\"small\">Plant for acid soils: eared willow, alder buckthorn, devil's-bit scabious, lesser spearwort, harebell.<\/p><\/div>\n<div class=\"duo-card marsch\"><h4>Marsch<\/h4><p>Clay and silt, fertile, with groundwater close to the surface. Infiltration is limited, so retention, ditches and wet ponds carry the water.<\/p><p class=\"small\">Plant for richer, base-rich soils: flowering-rush, arrowhead, hard rush, osier, white willow. Avoid compacting wet clay during construction.<\/p><\/div>\n<\/div>\n<div class=\"keybox\"><h4>Key numbers from DWA-A 138-1 (2024)<\/h4>\n<ul>\n<li>Permeability (k<sub>f<\/sub>) generally between 1 × 10<sup>−3<\/sup> and 1 × 10<sup>−6<\/sup> m/s.<\/li>\n<li>At least 1 m between the bottom of the infiltration facility and the mean highest groundwater level.<\/li>\n<li>Ponding in infiltration swales limited to 30 cm; basins usually 0.5 m and more.<\/li>\n<li>A vegetated soil layer of 20–30 cm treats the runoff.<\/li>\n<\/ul>\n<p class=\"small\">Always design with the current standard and agree the details with the local water authority.<\/p><\/div>","de":"<div class=\"duo\">\n<div class=\"duo-card geest\"><h4>Geest<\/h4><p>Sandig, sauer und oft nährstoffarm. Das Grundwasser steht meist tief und die Versickerung funktioniert gut – Versickerungsmulden und Mulden-Rigolen-Elemente sind der Normalfall.<\/p><p class=\"small\">Für saure Böden pflanzen: Ohr-Weide, Faulbaum, Teufelsabbiss, Brennender Hahnenfuß, Rundblättrige Glockenblume.<\/p><\/div>\n<div class=\"duo-card marsch\"><h4>Marsch<\/h4><p>Ton und Schluff, nährstoffreich, mit Grundwasser nah unter Flur. Die Versickerung ist begrenzt, deshalb tragen Retention, Gräben und Teiche das Wasser.<\/p><p class=\"small\">Für reichere, basenreiche Böden pflanzen: Schwanenblume, Pfeilkraut, Blaugrüne Binse, Korb-Weide, Silber-Weide. Nassen Klei beim Bau nicht verdichten.<\/p><\/div>\n<\/div>\n<div class=\"keybox\"><h4>Eckwerte aus dem DWA-A 138-1 (2024)<\/h4>\n<ul>\n<li>Durchlässigkeit (k<sub>f<\/sub>) in der Regel zwischen 1 × 10<sup>−3<\/sup> und 1 × 10<sup>−6<\/sup> m/s.<\/li>\n<li>Mindestens 1 m zwischen Sohle der Versickerungsanlage und mittlerem höchstem Grundwasserstand.<\/li>\n<li>Einstau in Versickerungsmulden auf 30 cm begrenzt; Becken meist ab 0,5 m.<\/li>\n<li>Eine bewachsene Bodenzone von 20–30 cm reinigt den Abfluss.<\/li>\n<\/ul>\n<p class=\"small\">Immer nach dem aktuellen Regelwerk planen und die Details mit der zuständigen Wasserbehörde abstimmen.<\/p><\/div>"},{"id":"grading","en_t":"Grading for diversity","de_t":"Modellierung für Vielfalt","en":"<ul>\n<li><b>Keep slopes flat.<\/b> 1:3 or flatter for mowing; 1:5 or flatter on shores where people, amphibians and dragonflies need gentle access.<\/li>\n<li><b>Add micro-relief of ±10–20 cm on the swale floor.<\/b> A few centimetres decide between flood sward and tall-sedge swamp, so small hollows and humps create several communities on one floor.<\/li>\n<li><b>Draw irregular outlines.<\/b> A curving edge is longer than a straight one and gives more transition habitat.<\/li>\n<li><b>Make ditches asymmetric.<\/b> A flat, sunny berm on one side for tall herbs and amphibians, a steeper bank on the other.<\/li>\n<li><b>Orient for sun.<\/b> Keep south and west banks open. Put willows and alders on the north or east side so they don't shade the water.<\/li>\n<li><b>Vary the depth of permanent ponds.<\/b> Combine a shallow shelf of 0–30 cm with a deeper zone so not everything freezes or dries out.<\/li>\n<\/ul>","de":"<ul>\n<li><b>Böschungen flach halten.<\/b> 1:3 oder flacher für die Mahd; 1:5 oder flacher an Ufern, an denen Menschen, Amphibien und Libellen sanft hinein- und herauskommen sollen.<\/li>\n<li><b>Mikrorelief von ±10–20 cm in der Muldensohle.<\/b> Wenige Zentimeter entscheiden zwischen Flutrasen und Großseggenried – kleine Senken und Kuppen schaffen mehrere Gesellschaften auf einer Sohle.<\/li>\n<li><b>Unregelmäßige Umrisse zeichnen.<\/b> Eine geschwungene Kante ist länger als eine gerade und bietet mehr Übergangslebensraum.<\/li>\n<li><b>Gräben asymmetrisch ausbilden.<\/b> Auf einer Seite eine flache, sonnige Berme für Hochstauden und Amphibien, auf der anderen eine steilere Böschung.<\/li>\n<li><b>Nach der Sonne ausrichten.<\/b> Süd- und Westufer offen halten. Weiden und Erlen auf die Nord- oder Ostseite, damit sie das Wasser nicht beschatten.<\/li>\n<li><b>Dauerteiche in der Tiefe staffeln.<\/b> Eine Flachwasserzone von 0–30 cm mit einem tieferen Bereich kombinieren, damit nicht alles durchfriert oder austrocknet.<\/li>\n<\/ul>"},{"id":"substrate","en_t":"Soil and substrate","de_t":"Boden und Substrat","en":"<p>Where an infiltration swale treats runoff, DWA-A 138-1 asks for a vegetated soil layer of about 20–30 cm. It filters pollutants, so keep it. For biodiversity, its nutrient level is what counts:<\/p>\n<ul>\n<li>Use a low-nutrient, low-humus topsoil without compost or fertiliser. Rich topsoil favours grasses and nettles and crowds out flowering herbs.<\/li>\n<li>On rims and slopes outside the treatment zone, lean sandy substrate is fine and raises diversity.<\/li>\n<li>Reuse suitable site topsoil; it carries local seed and soil life.<\/li>\n<li>Keep heavy machinery off the swale floor, especially on wet Marsch clay.<\/li>\n<\/ul>","de":"<p>Wo eine Versickerungsmulde Abfluss reinigt, fordert das DWA-A 138-1 eine bewachsene Bodenzone von etwa 20–30 cm. Sie hält Schadstoffe zurück und bleibt deshalb. Für die Artenvielfalt zählt ihr Nährstoffgehalt:<\/p>\n<ul>\n<li>Nährstoff- und humusarmen Oberboden ohne Kompost oder Dünger verwenden. Reicher Oberboden fördert Gräser und Brennnesseln und verdrängt Blühstauden.<\/li>\n<li>An Rändern und Böschungen außerhalb der Reinigungszone ist mageres, sandiges Substrat gut und erhöht die Vielfalt.<\/li>\n<li>Geeigneten Oberboden vor Ort wiederverwenden; er bringt heimisches Saatgut und Bodenleben mit.<\/li>\n<li>Schwere Maschinen von der Muldensohle fernhalten, besonders auf nassem Marschklei.<\/li>\n<\/ul>"},{"id":"flow","en_t":"Inflow, outflow and sediment","de_t":"Zulauf, Ablauf und Sediment","en":"<ul>\n<li><b>Break the energy at inflows<\/b> with a stone apron or cobbles so the planting doesn't wash out.<\/li>\n<li><b>Add a sediment trap<\/b> or settling zone in front of the main basin. It is easier to clean than a whole planted floor.<\/li>\n<li><b>Plan an emergency overflow<\/b> to the next element or to a safe flood route.<\/li>\n<li><b>Keep shrubs and trees out of the main flow line<\/b> and away from overflows. DWA-A 138-1 (2024) now allows trees in surface infiltration swales; underground storage needs root protection.<\/li>\n<li><b>Close the surface quickly<\/b> after construction: dense vegetation slows water and holds the soil.<\/li>\n<\/ul>","de":"<ul>\n<li><b>Energie am Zulauf brechen<\/b> – mit Steinschüttung oder Pflaster, damit die Pflanzung nicht ausgespült wird.<\/li>\n<li><b>Sedimentfang vorschalten<\/b> oder eine Absetzzone vor dem Hauptbecken anlegen. Sie lässt sich leichter reinigen als eine ganze bepflanzte Sohle.<\/li>\n<li><b>Notüberlauf einplanen<\/b> – zum nächsten Element oder auf einen sicheren Notwasserweg.<\/li>\n<li><b>Sträucher und Bäume aus der Hauptfließstrecke<\/b> und von Überläufen fernhalten. Das DWA-A 138-1 (2024) erlaubt inzwischen Bäume in oberirdischen Versickerungsmulden; unterirdische Speicher brauchen Wurzelschutz.<\/li>\n<li><b>Oberfläche nach dem Bau schnell schließen<\/b> – dichte Vegetation bremst Wasser und hält den Boden.<\/li>\n<\/ul>"},{"id":"planting","en_t":"Planting and establishment","de_t":"Pflanzung und Etablierung","en":"<ul>\n<li><b>Map the zones first,<\/b> then give each one a biotope (see the cross-section).<\/li>\n<li><b>Sow certified Regiosaatgut<\/b> from Ursprungsgebiet 1, Nordwestdeutsches Tiefland: a wet-meadow or bank mix on the floor, a lean mix on the rims.<\/li>\n<li><b>Add plugs of key herbs<\/b> in drifts of 5–15, and plant sedges and rushes where water stands longer.<\/li>\n<li><b>Sow in autumn or early spring.<\/b> Plant marginal and aquatic plants from late April to June, when the water warms up.<\/li>\n<li><b>Hold the water low in the first season<\/b> if you can, so plugs root before they are flooded.<\/li>\n<li><b>Protect new pond plantings from geese<\/b> with temporary netting or fencing.<\/li>\n<li><b>Water plugs in the first summer only;<\/b> after that the system should manage on its own.<\/li>\n<\/ul>","de":"<ul>\n<li><b>Erst die Zonen kartieren,<\/b> dann jeder Zone ein Biotop zuordnen (siehe Querschnitt).<\/li>\n<li><b>Zertifiziertes Regiosaatgut säen<\/b> aus Ursprungsgebiet 1, Nordwestdeutsches Tiefland: auf der Sohle eine Feuchtwiesen- oder Ufermischung, an den Rändern eine magere Mischung.<\/li>\n<li><b>Initialpflanzen wichtiger Stauden<\/b> in Gruppen von 5–15 ergänzen; Seggen und Binsen dort pflanzen, wo das Wasser länger steht.<\/li>\n<li><b>Im Herbst oder zeitigen Frühjahr säen.<\/b> Sumpf- und Wasserpflanzen von Ende April bis Juni pflanzen, wenn sich das Wasser erwärmt.<\/li>\n<li><b>Wasserstand in der ersten Saison möglichst niedrig halten,<\/b> damit die Pflanzen anwurzeln, bevor sie überstaut werden.<\/li>\n<li><b>Neue Teichpflanzungen vor Gänsen schützen<\/b> – mit vorübergehenden Netzen oder Zäunen.<\/li>\n<li><b>Nur im ersten Sommer wässern;<\/b> danach sollte sich das System selbst tragen.<\/li>\n<\/ul>"},{"id":"structures","en_t":"Habitat structures","de_t":"Habitatstrukturen","en":"<p>Plants feed animals; structures house them. Each of these costs little and brings in specific species. Tap an animal to see its profile.<\/p>","de":"<p>Pflanzen ernähren Tiere, Strukturen beherbergen sie. Jede dieser Strukturen kostet wenig und holt bestimmte Arten auf die Fläche. Tippe auf ein Tier, um sein Profil zu sehen.<\/p>","table":"structures"},{"id":"care","en_t":"Maintenance calendar","de_t":"Pflegekalender","en":"<p>The main rule: never maintain everything at once. Work in sections so animals always find somewhere to retreat to.<\/p>","de":"<p>Die wichtigste Regel: nie alles auf einmal pflegen. Abschnittsweise arbeiten, damit Tiere immer einen Rückzugsort finden.<\/p>","table":"care","en_after":"<p class=\"small\">§ 39 BNatSchG: trees, hedges and shrubs may not be cut back or removed between 1 March and 30 September, apart from gentle care cuts. Check inflows and sediment traps after every heavy rain as well.<\/p>","de_after":"<p class=\"small\">§ 39 BNatSchG: Bäume, Hecken und Gebüsche dürfen vom 1. März bis 30. September nicht zurückgeschnitten oder beseitigt werden, ausgenommen schonende Pflegeschnitte. Zuläufe und Sedimentfänge zusätzlich nach jedem Starkregen prüfen.<\/p>"},{"id":"rules","en_t":"Rules and references","de_t":"Regelwerke und Quellen","en":"<ul class=\"refs\">\n<li><b>DWA-A 138-1 (2024)<\/b>: design, construction and operation of rainwater infiltration systems.<\/li>\n<li><b>§ 40 BNatSchG<\/b>: since March 2020, plants and seed of non-local origin need approval in the open landscape.<\/li>\n<li><b>§ 39 BNatSchG<\/b>: cutting period for trees and shrubs.<\/li>\n<li><b>Origin regions<\/b>: Regiosaatgut from Ursprungsgebiet 1, Nordwestdeutsches Tiefland; gebietseigene Gehölze from Vorkommensgebiet 1, Norddeutsches Tiefland (<a href=\"https://www.bfn.de/sites/default/files/BfN/recht/Dokumente/leitfaden_gehoelze_.pdf\" target=\"_blank\" rel=\"noopener\">BfN guideline<\/a>).<\/li>\n<li><b>Hamburg<\/b>: RISA (RegenInfraStrukturAnpassung), <a href=\"https://www.risa-hamburg.de/wissen/bibliothek\" target=\"_blank\" rel=\"noopener\">RISA library<\/a>; <a href=\"https://www.hamburg.de/politik-und-verwaltung/behoerden/bvm/die-themen-der-behoerde/grundlagen-strassenwesen/wassersensible-strassenraumgestaltung-text-193190\" target=\"_blank\" rel=\"noopener\">Hinweise für eine wassersensible Straßenraumgestaltung<\/a>.<\/li>\n<li><b>Flora<\/b>: Poppendieck et al. (2010), Der Hamburger Pflanzenatlas; Rote Liste der Farn- und Blütenpflanzen Hamburgs; <a href=\"https://www.floraweb.de\" target=\"_blank\" rel=\"noopener\">FloraWeb<\/a>.<\/li>\n<\/ul>\n<p class=\"small\">This tool gives planning orientation, not a design calculation. Tolerance, height and pollinator values are indicative guide values; check them against current standards, nursery data and the site.<\/p>","de":"<ul class=\"refs\">\n<li><b>DWA-A 138-1 (2024)<\/b>: Planung, Bau und Betrieb von Anlagen zur Versickerung von Niederschlagswasser.<\/li>\n<li><b>§ 40 BNatSchG<\/b>: seit März 2020 brauchen Pflanzen und Saatgut nicht gebietseigener Herkunft in der freien Natur eine Genehmigung.<\/li>\n<li><b>§ 39 BNatSchG<\/b>: Schnittzeiten für Bäume und Gehölze.<\/li>\n<li><b>Herkunftsregionen<\/b>: Regiosaatgut aus Ursprungsgebiet 1, Nordwestdeutsches Tiefland; gebietseigene Gehölze aus Vorkommensgebiet 1, Norddeutsches Tiefland (<a href=\"https://www.bfn.de/sites/default/files/BfN/recht/Dokumente/leitfaden_gehoelze_.pdf\" target=\"_blank\" rel=\"noopener\">BfN-Leitfaden<\/a>).<\/li>\n<li><b>Hamburg<\/b>: RISA (RegenInfraStrukturAnpassung), <a href=\"https://www.risa-hamburg.de/wissen/bibliothek\" target=\"_blank\" rel=\"noopener\">RISA-Bibliothek<\/a>; <a href=\"https://www.hamburg.de/politik-und-verwaltung/behoerden/bvm/die-themen-der-behoerde/grundlagen-strassenwesen/wassersensible-strassenraumgestaltung-text-193190\" target=\"_blank\" rel=\"noopener\">Hinweise für eine wassersensible Straßenraumgestaltung<\/a>.<\/li>\n<li><b>Flora<\/b>: Poppendieck et al. (2010), Der Hamburger Pflanzenatlas; Rote Liste der Farn- und Blütenpflanzen Hamburgs; <a href=\"https://www.floraweb.de\" target=\"_blank\" rel=\"noopener\">FloraWeb<\/a>.<\/li>\n<\/ul>\n<p class=\"small\">Dieses Werkzeug gibt Planungsorientierung, ersetzt aber keine Bemessung. Toleranz-, Höhen- und Bestäuberwerte sind Richtwerte; mit aktuellem Regelwerk, Baumschuldaten und dem Standort abgleichen.<\/p>"}],"types":[{"en":"Infiltration swale","de":"Versickerungsmulde","fn_en":"Infiltrates runoff through a vegetated soil layer; dry most of the time.","fn_de":"Versickert Abfluss durch eine bewachsene Bodenzone; meist trocken.","d_en":"Ponding ≤ 30 cm, drains again quickly","d_de":"Einstau ≤ 30 cm, entleert sich rasch","s_en":"Geest, permeable sand","s_de":"Geest, durchlässiger Sand","b":["flutrasen","feuchtwiese","magerrasen"]},{"en":"Swale–trench system","de":"Mulden-Rigolen-Element","fn_en":"A swale above a gravel or crate trench that stores water and releases it slowly; for less permeable soils.","fn_de":"Mulde über einer Kies- oder Kastenrigole, die Wasser speichert und langsam abgibt; für weniger durchlässige Böden.","d_en":"Swale ≤ 30 cm plus storage below","d_de":"Mulde ≤ 30 cm plus Speicher darunter","s_en":"Loamy soils, low kf","s_de":"Lehmige Böden, geringer kf-Wert","b":["flutrasen","feuchtwiese","hochstauden"]},{"en":"Dry retention basin","de":"Retentionsbecken (trocken)","fn_en":"Holds water temporarily and releases it throttled; dry between events.","fn_de":"Hält Wasser vorübergehend zurück und gibt es gedrosselt ab; zwischen den Ereignissen trocken.","d_en":"Usually 0.5 m and more","d_de":"Meist ab 0,5 m","s_en":"Geest and Marsch","s_de":"Geest und Marsch","b":["flutrasen","hochstauden","grossseggen","feuchtwiese"]},{"en":"Wet retention pond","de":"Retentionsteich (Dauerstau)","fn_en":"A permanent pool with storage space above it; settles sediment.","fn_de":"Dauerwasserfläche mit Rückhalteraum darüber; lässt Sediment absetzen.","d_en":"Permanent water plus fluctuation","d_de":"Dauerwasser plus Schwankungsbereich","s_en":"Marsch, high groundwater","s_de":"Marsch, hoher Grundwasserstand","b":["offenwasser","roehricht","grossseggen","weiden"]},{"en":"Drainage ditch","de":"Graben","fn_en":"Conveys and stores water in a linear network; the backbone of drainage in the Marsch.","fn_de":"Leitet und speichert Wasser in einem linearen Netz; das Rückgrat der Entwässerung in der Marsch.","d_en":"Permanently or seasonally wet","d_de":"Dauerhaft oder zeitweise wasserführend","s_en":"Marsch","s_de":"Marsch","b":["offenwasser","roehricht","hochstauden","weiden"]},{"en":"Conveyance swale","de":"Fließmulde","fn_en":"A shallow, vegetated channel that slows water and passes it on to the next element.","fn_de":"Flache, bewachsene Rinne, die Wasser bremst und zum nächsten Element weiterleitet.","d_en":"Shallow flow","d_de":"Flacher Abfluss","s_en":"Any","s_de":"Alle","b":["flutrasen","feuchtwiese"]}],"care":[{"en":"Mow wet meadows, 1st cut","de":"Feuchtwiese mähen, 1. Schnitt","m":[6,7]},{"en":"Mow wet meadows, 2nd cut","de":"Feuchtwiese mähen, 2. Schnitt","m":[9]},{"en":"Mow tall herbs (every 1–3 years)","de":"Hochstauden mähen (alle 1–3 Jahre)","m":[9,10]},{"en":"Cut reed in sections","de":"Röhricht abschnittsweise schneiden","m":[1,2,10,11,12]},{"en":"Coppice and pollard willows","de":"Weiden auf den Stock setzen, Kopfweiden schneiden","m":[1,2,10,11,12]},{"en":"Clear ditches in sections","de":"Gräben abschnittsweise räumen","m":[10,11]},{"en":"Cut back old stems","de":"Altstängel zurückschneiden","m": function filterSpecies(){
  const f=S.f, q=f.q.trim().toLowerCase();
  let list=DATA.species.filter(s=>{
    if(q&&!(s.de.toLowerCase().includes(q)||s.en.toLowerCase().includes(q)||s.la.toLowerCase().includes(q)))return false;
    if(f.zones.size&&!f.zones.has(s.z))return false;
    if(f.soil&&!(s.so===f.soil||s.so==="both"))return false;
    if(f.flood&&s.fl<f.flood)return false;
    if(f.month&&!inMonth(s.m,f.month))return false;
    if(f.poll&&s.p<4)return false;
    if(f.salt&&s.sa==="low")return false;
    if(f.type&&s.t!==f.type)return false;
    return true;});
  const coll=new Intl.Collator(S.lang);
  const by={zone:(a,b)=>a.z.localeCompare(b.z)||coll.compare(a.de,b.de),name:(a,b)=>coll.compare(a.de,b.de),latin:(a,b)=>a.la.localeCompare(b.la),
    flower:(a,b)=>a.m[0]-b.m[0]||a.m[1]-b.m[1]||coll.compare(a.de,b.de),poll:(a,b)=>b.p-a.p||coll.compare(a.de,b.de)};
  return list.sort(by[f.sort]);
}

function mixAnalysis(){
  const ids=S.mix, sp=ids.map(id=>SP[id]);
  const nectar=[];for(let i=1;i<=12;i++)nectar.push(sp.filter(s=>s.p>=3&&inMonth(s.m,i)));
  const zones={A:0,B:0,C:0,D:0};sp.forEach(s=>zones[s.z]++);
  const goodMonths=[3,4,5,6,7,8,9,10].filter(m=>nectar[m-1].length>=3).length;
  const gaps=[3,4,5,6,7,8,9,10].filter(m=>nectar[m-1].length<2);
  const sup={};
  ids.forEach(id=>spFauna[id].forEach(({f,role})=>{(sup[f]=sup[f]||new Set()).add(id);}));
  return {sp,nectar,zones,goodMonths,gaps,sup};
}
function nectarChart(nectar,gaps){
  const W=600,H=210,ml=30,mr=8,mt=14,mb=30,pw=W-ml-mr,ph=H-mt-mb;
  const counts=nectar.map(a=>a.length),mx=Math.max(4,...counts);
  const step=mx<=6?1:(mx<=12?2:5), top=Math.ceil(mx/step)*step;
  const y=v=>mt+ph-v/top*ph, cw=pw/12, bw=cw*.6;
  let g="";
  for(let v=0;v<=top;v+=step){g+=`<line class="${v?"grid-l":"base"}" x1="${ml}" x2="${W-mr}" y1="${f1(y(v))}" y2="${f1(y(v))}"/><text class="ax" x="${ml-8}" y="${f1(y(v)+4)}" text-anchor="end">${v}</text>`;}
  counts.forEach((c,i)=>{
    const x=ml+i*cw+(cw-bw)/2, yy=y(c), h=mt+ph-yy;
    g+=`<g class="col" data-i="${i}">`;
    if(c>0){const r=Math.min(4,h);g+=`<path class="bar" d="M${f1(x)} ${f1(mt+ph)} L${f1(x)} ${f1(yy+r)} Q${f1(x)} ${f1(yy)} ${f1(x+r)} ${f1(yy)} L${f1(x+bw-r)} ${f1(yy)} Q${f1(x+bw)} ${f1(yy)} ${f1(x+bw)} ${f1(yy+r)} L${f1(x+bw)} ${f1(mt+ph)} Z"/>`;}
    if(gaps.includes(i+1)) g+=`<text class="gap-t" x="${f1(x+bw/2)}" y="${f1(yy-6)}" text-anchor="middle">${esc(t("gap"))}</text>`;
    g+=`<text class="ax" x="${f1(ml+i*cw+cw/2)}" y="${H-10}" text-anchor="middle">${ROMAN[i]}</text>`;
    g+=`<rect class="hit" x="${f1(ml+i*cw)}" y="${mt}" width="${f1(cw)}" height="${ph+mb}" data-tip="nectar" data-i="${i}"/></g>`;
  });
  return `<div class="chart" id="nectar-chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(t("nectarT"))}: ${counts.map((c,i)=>ROMAN[i]+" "+c).join(", ")}">${g}</svg></div>`;
}
