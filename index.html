  const el=$("#p-mix");
  const head=`<div class="panel-head"><div><h2>${esc(t("mixTitle"))}</h2><p>${esc(t("mixIntro"))}</p></div>
   <div class="row-actions">${S.mix.length?(S.confirmClear?`<span class="confirm">${esc(t("clearQ",{n:S.mix.length}))} <button type="button" class="btn primary" data-act="mix-clear-yes">${esc(t("yes"))}</button><button type="button" class="btn" data-act="mix-clear-no">${esc(t("cancel"))}</button></span>`:`<button type="button" class="btn" data-act="mix-clear">${esc(t("clear"))}</button>`):""}${!S.mixExample?`<button type="button" class="btn ghost" data-act="mix-example">${esc(t("loadEx"))}</button>`:""}</div></div>`;
  if(!S.mix.length){
    el.innerHTML=head+`<div class="empty"><h3>${esc(t("emptyT"))}</h3><p style="max-width:52ch">${esc(t("emptyP"))}</p><div class="row-actions" style="justify-content:center"><button type="button" class="btn primary" data-act="tab" data-v="plants">${esc(t("goPlants"))}</button><button type="button" class="btn" data-act="tab" data-v="biotopes">${esc(t("goBio"))}</button></div></div>`;
    return;}
  const A=mixAnalysis();
  const notes=[];
  const spread=A.sp.filter(s=>s.f.includes("spread")).map(s=>s.de);
  if(spread.length) notes.push(["w",t("spreadW",{l:listJoin(spread)})]);
  const g=A.sp.filter(s=>s.so==="geest").map(s=>s.de), m=A.sp.filter(s=>s.so==="marsch").map(s=>s.de);
  if(g.length&&m.length) notes.push(["w",t("soilW",{g:listJoin(g),m:listJoin(m)})]);
  if(A.gaps.length){
    const mo=listJoin(A.gaps.map(k=>T[S.lang].months[k-1]));
    const zonesIn=new Set(A.sp.map(s=>s.z));
    const cand=DATA.species.filter(s=>!S.mix.includes(s.id)&&s.p>=4&&!s.f.includes("spread")&&A.gaps.some(k=>inMonth(s.m,k))&&zonesIn.has(s.z))
      .sort((a,b)=>A.gaps.filter(k=>inMonth(b.m,k)).length-A.gaps.filter(k=>inMonth(a.m,k)).length||b.p-a.p).slice(0,4);
    notes.push(["w",cand.length?t("gapW",{mo,l:cand.map(s=>s.de).join(", ")}):t("gapW0",{mo}),cand.map(s=>s.id)]);
  } else notes.push(["ok",t("okNectar")]);
  const prot=A.sp.filter(s=>s.f.includes("protected")).map(s=>s.de);
  if(prot.length) notes.push(["w",t("protW",{l:listJoin(prot)})]);
  const missing=["A","B","C","D"].filter(z=>!A.zones[z]).map(z=>t("zones."+z));
  if(missing.length) notes.push(["i",t("zoneI",{z:listJoin(missing)})]);
  const supIds=Object.keys(A.sup).sort((a,b)=>A.sup[b].size-A.sup[a].size);
  const isSpec=fid=>/oligolect|Specialist|Spezialist/i.test(FA[fid].st.en)&&FA[fid].pl.filter(p=>p[1]==="pollen"||p[1]==="host").some(p=>S.mix.includes(p[0]));
  const exportTxt=A.sp.slice().sort((a,b)=>a.z.localeCompare(b.z)||a.de.localeCompare(b.de)).map(s=>`${s.z} · ${s.de} – ${s.la}`).join("\n");
  el.innerHTML=head+
   (S.mixExample?`<div class="banner"><p>${esc(t("exampleBanner"))}</p></div>`:"")+
   `<div class="tiles">
     <div class="tile"><div class="v">${A.sp.length}</div><div class="k">${esc(t("tSpecies"))}</div></div>
     <div class="tile"><div class="zones">${["A","B","C","D"].map(z=>`<span class="zb ${z}${A.zones[z]?"":" off"}" title="${esc(t("zones."+z))}: ${A.zones[z]}">${z}</span>`).join("")}</div><div class="k">${esc(t("tZones"))}</div></div>
     <div class="tile"><div class="v">${A.goodMonths}<small> / 8</small></div><div class="k">${esc(t("tMonths"))}</div></div>
     <div class="tile"><div class="v">${supIds.length}</div><div class="k">${esc(t("tFauna"))}</div></div>
   </div>
   <div class="mix-grid"><div>
     <div class="box"><h3>${esc(t("nectarT"))}</h3><p class="sub">${esc(t("nectarS"))}</p>${nectarChart(A.nectar,A.gaps)}</div>
     <div class="box"><h3>${esc(t("calT"))}</h3><p class="sub">${esc(t("calS"))}</p>${calendar(A.sp)}</div>
   </div><div>
     <div class="box"><h3>${esc(t("notesT"))}</h3><ul class="notes" style="margin-top:10px">${notes.map(([k,txt,cand])=>`<li><span class="ic ${k}">${k==="w"?"!":(k==="ok"?"✓":"i")}</span><div>${esc(txt)}${cand&&cand.length?`<div class="chips" style="margin-top:6px">${cand.map(id=>`<button type="button" class="chip" data-act="mix-toggle" data-id="${id}"><span class="dot" style="--c:${col(SP[id].c)}"></span>+ ${esc(SP[id].de)}</button>`).join("")}</div>`:""}</div></li>`).join("")}</ul></div>
     <div class="box"><h3>${esc(t("supT"))}</h3><p class="sub">${esc(t("supS"))}</p><div class="chips">${supIds.map(fid=>faChip(fid,isSpec(fid)?t("specialist"):"")).join("")||"–"}</div></div>
     <div class="box"><h3>${esc(t("exportT"))}</h3><textarea class="export" id="export" readonly>${esc(exportTxt)}</textarea><div class="row-actions" style="margin-top:8px"><button type="button" class="btn" data-act="copy">${esc(t("copy"))}</button></div></div>
   </div></div>`;
}
function showTip(target){
  const chart=target.closest(".chart");if(!chart)return;
  let tip=chart.querySelector(".tip");if(!tip){tip=document.createElement("div");tip.className="tip";chart.appendChild(tip);}
  const i=+target.dataset.i, A=mixAnalysis(), list=A.nectar[i];
  const names=list.slice(0,8).map(s=>esc(s.de)).join(", ")+(list.length>8?` +${list.length-8}`:"");
  tip.innerHTML=`<b>${esc(T[S.lang].months[i])}</b> · ${list.length}<br>${names||"–"}`;
  const cb=chart.getBoundingClientRect(), tb=target.getBoundingClientRect();
  let left=tb.left-cb.left+tb.width/2-110; left=Math.max(0,Math.min(left,cb.width-230));
  tip.style.left=left+"px"; tip.style.top="0px"; tip.hidden=false;
}
function hideTip(){document.querySelectorAll(".chart .tip").forEach(t=>t.hidden=true);}

/* ---------- guide ---------- */
function guideTable(kind){
  if(kind==="types"){
    return `<div class="tbl-wrap"><table class="types"><thead><tr><th>${esc(t("th.type"))}</th><th>${esc(t("th.fn"))}</th><th>${esc(t("th.water"))}</th><th>${esc(t("th.soil"))}</th><th>${esc(t("th.bio"))}</th></tr></thead><tbody>${DATA.types.map(r=>`<tr><td><b>${esc(L(r))}</b><br><span class="small muted">${esc(S.lang==="de"?r.en:r.de)}</span></td><td>${esc(S.lang==="de"?r.fn_de:r.fn_en)}</td><td>${esc(S.lang==="de"?r.d_de:r.d_en)}</td><td>${esc(S.lang==="de"?r.s_de:r.s_en)}</td><td><div class="chips">${r.b.map(b=>bioChip(b)).join("")}</div></td></tr>`).join("")}</tbody></table></div>`;}
  if(kind==="structures"){
    return `<div class="tbl-wrap"><table class="structs"><thead><tr><th>${esc(t("th.struct"))}</th><th>${esc(t("th.where"))}</th><th>${esc(t("th.who"))}</th></tr></thead><tbody>${Object.keys(DATA.struct).filter(k=>stFauna[k]).map(k=>`<tr><td><b>${esc(L(DATA.struct[k]))}</b></td><td>${esc(S.lang==="de"?DATA.struct[k].wde:DATA.struct[k].wen)}</td><td><div class="chips">${stFauna[k].map(fid=>faChip(fid)).join("")}</div></td></tr>`).join("")}</tbody></table></div>`;}
  if(kind==="care"){
    return `<div class="tbl-wrap"><table class="care"><thead><tr><th>${esc(t("th.task"))}</th>${T[S.lang].months.map((m,i)=>`<th class="m" title="${esc(m)}">${ROMAN[i]}</th>`).join("")}</tr></thead><tbody>${DATA.care.map(r=>`<tr><td>${esc(L(r))}</td>${Array.from({length:12},(_,i)=>`<td class="m${r.m.includes(i+1)?" on":""}"><i></i></td>`).join("")}</tr>`).join("")}</tbody></table></div>`;}
  return "";
}
function renderGuide(){
  const G=DATA.guide;
  $("#p-guide").innerHTML=`
  <div class="panel-head"><div><h2>${esc(t("guideTitle"))}</h2><p>${esc(t("guideIntro"))}</p></div></div>
  <div class="guide">
   <nav class="toc" aria-label="Contents">${G.map((s,i)=>`<button type="button" data-act="toc" data-v="${s.id}"><span class="num">${i+1}</span>${esc(S.lang==="de"?s.de_t:s.en_t)}</button>`).join("")}</nav>
   <div class="g-body">${G.map((s,i)=>`<section class="g-sec" id="g-${s.id}"><h2><span class="num">${String(i+1).padStart(2,"0")}</span>${esc(S.lang==="de"?s.de_t:s.en_t)}</h2>${S.lang==="de"?s.de:s.en}${s.table?guideTable(s.table):""}${s.action==="crosssection"?`<div style="margin-top:12px"><button type="button" class="btn primary" data-act="goto-cross">${esc(t("showCross"))}</button></div>`:""}${(S.lang==="de"?s.de_after:s.en_after)||""}</section>`).join("")}</div>
  </div>`;
}

/* ---------- sheet ---------- */
function sheetSpecies(s){
  const inm=S.mix.includes(s.id);
  const bios=spBio[s.id];
  const fa=spFauna[s.id];
  const byF={};fa.forEach(({f,role})=>{(byF[f]=byF[f]||[]).push(L(DATA.roles[role]));});
  return `<div class="card-top"><span class="zb ${s.z}">${s.z}</span><span class="small">${esc(t("zones."+s.z))} · ${esc(t("zonesSub."+s.z))}</span>${s.f.map(fl=>`<span class="pill warn">${esc(t("flags."+fl))}</span>`).join("")}</div>
  <div><h2 id="sheet-title">${esc(s.de)}</h2><p class="latin">${esc(s.la)}</p><p class="muted">${esc(s.en)}</p></div>
  <div style="display:flex;flex-direction:column;gap:8px">
   <div class="mrow"><span>${esc(t("meters.fl"))}</span>${meter("fl",s.fl)}<b>${s.fl}/5</b></div>
   <div class="mrow"><span>${esc(t("meters.dr"))}</span>${meter("dr",s.dr)}<b>${s.dr}/5</b></div>
   <div class="mrow"><span>${esc(t("meters.po"))}</span>${meter("po",s.p)}<b>${s.p}/5</b></div>
  </div>
  <p>${esc(L(s.n))}</p>
  <div class="kv">
   <div><div class="k">${esc(t("typeL"))}</div><div class="v">${esc(t("types."+s.t))}</div></div>
   <div><div class="k">${esc(t("height"))}</div><div class="v">${esc(s.h)}</div></div>
   <div><div class="k">${esc(t("flowering"))}</div><div class="v">${esc(range(s.m))}</div></div>
   <div><div class="k">${esc(t("colour"))}</div><div class="v"><span class="dot" style="--c:${col(s.c)}"></span>${esc(colName(s.c))}</div></div>
   <div><div class="k">${esc(t("habit"))}</div><div class="v">${esc(t("habits."+s.hb))}</div></div>
   <div><div class="k">${esc(t("soil"))}</div><div class="v">${esc(t("soils."+s.so))}</div></div>
   <div><div class="k">${esc(t("saltL"))}</div><div class="v">${esc(t("salts."+s.sa))}</div></div>
  </div>
  <div>${strip(s.m,col(s.c),true)}</div>
  <div class="block"><h3>${esc(t("inBio"))}</h3><div class="chips">${bios.map(x=>bioChip(x.b,x.core?t("asCore"):t("asComp"))).join("")}</div></div>
  ${Object.keys(byF).length?`<div class="block"><h3>${esc(t("usedBy"))}</h3><div class="chips">${Object.keys(byF).map(fid=>faChip(fid,[...new Set(byF[fid])].join(", "))).join("")}</div></div>`:""}
  <div><button type="button" class="btn ${inm?"":"primary"}" data-act="mix-toggle" data-id="${s.id}" aria-pressed="${inm}">${esc(inm?t("removeMix"):t("addMixLong"))}</button></div>`;
}
function sheetFauna(f){
  const roles={};f.pl.forEach(([pid,role])=>{(roles[role]=roles[role]||[]).push(pid);});
  return `<div class="card-top"><span class="grp" style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--accent)">${esc(L(DATA.groups[f.g]))}</span><span class="pill">${esc(L(f.st))}</span></div>
  <div><h2 id="sheet-title">${esc(faName(f))}</h2><p class="latin">${esc(f.la)}</p><p class="muted">${esc(faAlt(f))}</p></div>
  <p>${esc(L(f.tx))}</p>
  <div class="block"><h3>${esc(t("active"))} · ${esc(range(f.m))}</h3>${strip(f.m,"var(--accent)",true)}</div>
  ${f.pl.length?`<div class="block"><h3>${esc(t("needsPlants"))}</h3>${Object.keys(roles).map(r=>`<div class="rolegrp"><span class="small">${esc(L(DATA.roles[r]))}</span><div class="chips">${roles[r].map(id=>spChip(id)).join("")}</div></div>`).join("")}</div>`:""}
  <div class="block"><h3>${esc(t("needsStruct"))}</h3><ul class="struct-list">${f.sr.map(k=>`<li>${esc(L(DATA.struct[k]))}<span class="w">${esc(S.lang==="de"?DATA.struct[k].wde:DATA.struct[k].wen)}</span></li>`).join("")}</ul></div>
  <div class="block"><h3>${esc(t("foundIn"))}</h3><div class="chips">${(faBio[f.id]||[]).map(b=>bioChip(b)).join("")}</div></div>`;
}
function renderSheet(){
  const top=S.stack[S.stack.length-1], wrap=$("#sheet");
  if(!top){wrap.hidden=true;document.body.style.overflow="";return;}
  wrap.hidden=false;document.body.style.overflow="hidden";
  $("#sheet-back-slot").innerHTML=S.stack.length>1?`<button type="button" class="iconbtn" data-act="sheet-back">← ${esc(t("back"))}</button>`:"";
  $("#sheet-close").textContent=t("close");
  const body=$("#sheet-body");
  body.innerHTML=top.type==="sp"?sheetSpecies(SP[top.id]):sheetFauna(FA[top.id]);
  body.scrollTop=0;
}
function openSheet(type,id){
  if(!S.stack.length) S.lastFocus=document.activeElement;
  const top=S.stack[S.stack.length-1];
  if(top&&top.type===type&&top.id===id) return;
  S.stack.push({type,id});renderSheet();
  setTimeout(()=>{const c=$("#sheet-close");if(c)c.focus({preventScroll:true});},30);
}
function closeSheet(){S.stack=[];renderSheet();if(S.lastFocus&&document.contains(S.lastFocus))S.lastFocus.focus({preventScroll:true});}

/* ---------- mix ops ---------- */
function afterMixChange(){
  saveMix();updateBadge();
  if(S.tab==="mix")renderMix();
  if(S.tab==="plants")document.querySelectorAll("#pl-grid .mixbtn").forEach(b=>{const on=S.mix.includes(b.dataset.id);b.setAttribute("aria-pressed",on);b.textContent=on?t("inMix"):t("addMix");});
  if(S.stack.length)renderSheet();
}
function toggleMix(id){
  const s=SP[id];
  if(S.mix.includes(id)){S.mix=S.mix.filter(x=>x!==id);toast((S.lang==="de"?"Entfernt: ":"Removed: ")+s.de);}
  else{S.mix.push(id);toast((S.lang==="de"?"Hinzugefügt: ":"Added: ")+s.de);}
  S.mixExample=false;S.confirmClear=false;afterMixChange();
}

/* ---------- routing ---------- */
const renderers={biotopes:renderBiotopes,plants:renderPlants,fauna:renderFauna,mix:renderMix,guide:renderGuide};
function setTab(k,noHash){
  S.tab=k;S.confirmClear=false;
  document.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-selected",b.dataset.v===k));
  TABS.forEach(x=>{$("#p-"+x).hidden=x!==k;});
  renderers[k]();revealTab();
  if(!noHash){try{history.replaceState(null,"","#"+k);}catch(e){try{location.hash=k;}catch(e2){}}}
}
function renderAll(){renderChrome();renderers[S.tab]();if(S.stack.length)renderSheet();}

/* ---------- events ---------- */
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-act]");if(!el)return;
  const a=el.dataset.act,v=el.dataset.v,id=el.dataset.id;
  switch(a){
    case "lang": S.lang=v;store.set("wf_lang",v);renderAll();break;
    case "tab": if(S.stack.length)closeSheet();setTab(v);window.scrollTo({top:0});break;
    case "profile": S.profile=v;renderBiotopes();break;
    case "water": S.water=v;updateWater();break;
    case "bio": if(S.stack.length)closeSheet();selectBio(id,el.closest("#p-biotopes")===null||el.classList.contains("chip"));break;
    case "sp": openSheet("sp",id);break;
    case "fa": openSheet("fa",id);break;
    case "sheet-close": closeSheet();break;
    case "sheet-back": S.stack.pop();renderSheet();break;
    case "mix-toggle": e.stopPropagation();toggleMix(id);break;
    case "mix-add-bio":{const b=BI[id];const add=b.core.concat(b.comp).filter(x=>!S.mix.includes(x));S.mix=S.mix.concat(add);S.mixExample=false;afterMixChange();toast(add.length?t("added",{n:add.length}):t("already"));break;}
    case "mix-clear": S.confirmClear=true;renderMix();break;
    case "mix-clear-no": S.confirmClear=false;renderMix();break;
    case "mix-clear-yes": S.mix=[];S.mixExample=false;S.confirmClear=false;afterMixChange();break;
    case "mix-example": S.mix=EXAMPLE.slice();S.mixExample=true;afterMixChange();break;
    case "copy":{const ta=$("#export");const txt=ta.value;const fail=()=>{ta.focus();ta.select();toast(t("copyFail"));};
      try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(()=>toast(t("copied")),fail);}else fail();}catch(err){fail();}break;}
    case "f-open": S.filtersOpen=!S.filtersOpen;$("#filters").classList.toggle("open",S.filtersOpen);el.setAttribute("aria-expanded",S.filtersOpen);break;
    case "f-zone": if(S.f.zones.has(v))S.f.zones.delete(v);else S.f.zones.add(v);el.setAttribute("aria-pressed",S.f.zones.has(v));renderPlantResults();break;
    case "f-reset": S.f={q:"",zones:new Set(),soil:"",flood:0,month:0,poll:false,salt:false,type:"",sort:S.f.sort};renderPlants();break;
    case "fa-group": S.fg=v;document.querySelectorAll("[data-act='fa-group']").forEach(b=>b.setAttribute("aria-pressed",b.dataset.v===S.fg));renderFaunaResults();break;
    case "toc":{const sec=$("#g-"+v);if(sec)sec.scrollIntoView({behavior:"smooth",block:"start"});break;}
    case "goto-cross": setTab("biotopes");setTimeout(()=>{const f=$("#cross");if(f)f.scrollIntoView({behavior:"smooth",block:"center"});},50);break;
  }
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&S.stack.length){closeSheet();return;}
  if((e.key==="Enter"||e.key===" ")&&e.target.matches&&e.target.matches("svg .band")){e.preventDefault();e.target.dispatchEvent(new MouseEvent("click",{bubbles:true}));}
});
document.addEventListener("input",e=>{
  const id=e.target.id;
  if(id==="f-q"){S.f.q=e.target.value;renderPlantResults();}
  else if(id==="fa-q"){S.fq=e.target.value;renderFaunaResults();}
});
document.addEventListener("change",e=>{
  const id=e.target.id,v=e.target.value;
  if(id==="f-soil")S.f.soil=v;
  else if(id==="f-flood")S.f.flood=+v;
  else if(id==="f-month")S.f.month=+v;
  else if(id==="f-type")S.f.type=v;
  else if(id==="f-sort")S.f.sort=v;
  else if(id==="f-poll")S.f.poll=e.target.checked;
  else if(id==="f-salt")S.f.salt=e.target.checked;
  else return;
  renderPlantResults();
});
document.addEventListener("mouseover",e=>{const h=e.target.closest&&e.target.closest("[data-tip]");if(h)showTip(h);});
document.addEventListener("mouseout",e=>{const h=e.target.closest&&e.target.closest("[data-tip]");if(h&&!(e.relatedTarget&&h.contains(e.relatedTarget)))hideTip();});
document.addEventListener("click",e=>{const h=e.target.closest&&e.target.closest("[data-tip]");if(h)showTip(h);else hideTip();},true);
document.addEventListener("keydown",e=>{
  const tabs=[...document.querySelectorAll(".tab")];const i=tabs.indexOf(document.activeElement);
  if(i<0)return;
  if(e.key==="ArrowRight"||e.key==="ArrowLeft"){e.preventDefault();const n=tabs[(i+(e.key==="ArrowRight"?1:-1)+tabs.length)%tabs.length];n.focus();n.click();}
});

/* ---------- boot ---------- */
const h=(location.hash||"").replace("#","");
if(TABS.includes(h))S.tab=h;
renderChrome();renderers[S.tab]();
})();
</script>
</body>
</html>
