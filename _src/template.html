<title>Wechselfeucht Hamburg</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=Source+Serif+4:ital,opsz,wght@1,8..60,400;1,8..60,600&display=swap">
<style>
/* Layout: field-guide app. Slim masthead, sticky tab rail, one working canvas per tab; the interactive cross-section (Querprofil) is the signature element. */
:root{
  --bg:#ECF0EB; --surface:#FAFCF9; --surface-2:#E1E8E1; --ink:#16221C; --ink-2:#44564D; --ink-3:#6B7D73; --line:#C8D3CA; --line-strong:#9DAEA3;
  --accent:#1C6858; --accent-ink:#FFFFFF; --accent-soft:#D2E6DE; --hl:rgba(28,104,88,.12);
  --water:#86B8CF; --water-line:#2C7093; --sand:#E7D8AE; --sand-dot:#C6AE72; --clay:#ABA08D; --clay-line:#8A7E6B; --topsoil:#6E5A42; --gw:#2C7093;
  --veg:#3B7146; --veg-2:#76A15C; --bloom-1:#B23E7A; --bloom-2:#D4A82A; --bloom-3:#F3EEDF; --bloom-4:#5272BE; --reed:#83633D; --trunk:#5C4938;
  --m-flood:#2C7093; --m-drought:#B0822A; --m-poll:#3B7146;
  --zA:#2F7EA3; --zB:#9C7A22; --zC:#2A5A84; --zD:#3B7146;
  --warn:#9A5418; --warn-soft:#F4E4D0;
  --shadow:0 10px 30px rgba(22,34,28,.16);
  --font-display:"Bricolage Grotesque","Avenir Next","Segoe UI",sans-serif;
  --font-body:"Source Sans 3","Segoe UI",system-ui,sans-serif;
  --font-latin:"Source Serif 4",Georgia,"Times New Roman",serif;
  --fs-xs:12px; --fs-s:13.5px; --fs-m:15px; --fs-l:17px; --fs-xl:21px; --fs-2xl:28px; --fs-3xl:36px;
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1713; --surface:#16211B; --surface-2:#1F2C25; --ink:#E2EBE5; --ink-2:#A7B8AE; --ink-3:#7D8F85; --line:#2B3B33; --line-strong:#41554A;
    --accent:#62C3A7; --accent-ink:#0C1A14; --accent-soft:#1C3A31; --hl:rgba(98,195,167,.14);
    --water:#2B5C74; --water-line:#6FB3D5; --sand:#4A4330; --sand-dot:#6C5F41; --clay:#3F3931; --clay-line:#5C5345; --topsoil:#2C2318; --gw:#6FB3D5;
    --veg:#7AB97D; --veg-2:#A2CA86; --bloom-1:#E07BAE; --bloom-2:#EBC657; --bloom-3:#E6DFC9; --bloom-4:#8DADEF; --reed:#B58F5F; --trunk:#A28871;
    --m-flood:#6FB3D5; --m-drought:#D9B45B; --m-poll:#7AB97D;
    --zA:#6FB3D5; --zB:#D9B45B; --zC:#93BCE6; --zD:#7AB97D;
    --warn:#E6A25F; --warn-soft:#382816;
    --shadow:0 12px 34px rgba(0,0,0,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
    --bg:#0F1713; --surface:#16211B; --surface-2:#1F2C25; --ink:#E2EBE5; --ink-2:#A7B8AE; --ink-3:#7D8F85; --line:#2B3B33; --line-strong:#41554A;
    --accent:#62C3A7; --accent-ink:#0C1A14; --accent-soft:#1C3A31; --hl:rgba(98,195,167,.14);
    --water:#2B5C74; --water-line:#6FB3D5; --sand:#4A4330; --sand-dot:#6C5F41; --clay:#3F3931; --clay-line:#5C5345; --topsoil:#2C2318; --gw:#6FB3D5;
    --veg:#7AB97D; --veg-2:#A2CA86; --bloom-1:#E07BAE; --bloom-2:#EBC657; --bloom-3:#E6DFC9; --bloom-4:#8DADEF; --reed:#B58F5F; --trunk:#A28871;
    --m-flood:#6FB3D5; --m-drought:#D9B45B; --m-poll:#7AB97D;
    --zA:#6FB3D5; --zB:#D9B45B; --zC:#93BCE6; --zD:#7AB97D;
    --warn:#E6A25F; --warn-soft:#382816;
    --shadow:0 12px 34px rgba(0,0,0,.5);
    color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:var(--fs-m);line-height:1.55;margin:0}
.wrap{max-width:1140px;margin:0 auto;padding-inline:16px}
@media (min-width:720px){.wrap{padding-inline:28px}}
h1,h2,h3,h4{font-family:var(--font-display);line-height:1.15;margin:0;text-wrap:balance;font-weight:700;letter-spacing:-.01em}
p{margin:0}
a{color:var(--accent)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.latin{font-family:var(--font-latin);font-style:italic}
.eyebrow{font-size:var(--fs-xs);text-transform:uppercase;letter-spacing:.09em;color:var(--ink-3);font-weight:600}
.small{font-size:var(--fs-s);color:var(--ink-2)}
.muted{color:var(--ink-3)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Masthead */
.mast{padding-block:22px 14px}
.mast-row{display:flex;gap:16px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.mast h1{font-size:var(--fs-3xl);font-weight:700;letter-spacing:-.025em}
.mast h1 span{color:var(--accent)}
.mast .sub{color:var(--ink-2);max-width:62ch;margin-top:6px;font-size:var(--fs-l)}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:999px;padding:3px;background:var(--surface);gap:2px}
.seg button{border:0;background:transparent;padding:6px 13px;border-radius:999px;cursor:pointer;font-size:var(--fs-s);font-weight:600;color:var(--ink-2);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.seg button:hover:not([aria-pressed="true"]){background:var(--surface-2)}

/* Tabs */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.tabs-in{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabs-in::-webkit-scrollbar{display:none}
.tab{border:0;background:transparent;padding:13px 12px 11px;font-weight:600;color:var(--ink-2);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;display:flex;align-items:center;gap:7px;font-size:var(--fs-m)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab:hover{color:var(--ink)}
.badge{font-size:11px;font-weight:700;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:1px 7px;font-variant-numeric:tabular-nums}
main{padding-block:22px 48px}
.panel-head{display:flex;justify-content:space-between;gap:14px;align-items:flex-end;flex-wrap:wrap;margin-bottom:16px}
.panel-head h2{font-size:var(--fs-2xl)}
.panel-head p{color:var(--ink-2);max-width:64ch;margin-top:6px}

/* Buttons & chips */
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line-strong);background:var(--surface);border-radius:999px;padding:8px 15px;cursor:pointer;font-weight:600;font-size:var(--fs-s)}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 11px 4px 9px;font-size:var(--fs-s);cursor:pointer;line-height:1.35;text-align:left}
.chip:hover{border-color:var(--accent)}
.chip .csub{color:var(--ink-3);font-size:var(--fs-xs)}
.chip.on,.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--c);box-shadow:0 0 0 1px var(--line-strong);flex:none}
.zb{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:6px;font-family:var(--font-display);font-weight:700;font-size:12px;border:1.5px solid currentColor;flex:none}
.zb.A{color:var(--zA)}.zb.B{color:var(--zB)}.zb.C{color:var(--zC)}.zb.D{color:var(--zD)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:var(--fs-xs);font-weight:600;padding:2px 9px;border-radius:999px;background:var(--surface-2);color:var(--ink-2)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.gtag{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3)}

/* Cross-section */
.bio-controls{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;margin-bottom:12px}
.bio-controls .lbl{font-size:var(--fs-xs);text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);font-weight:600;margin-right:2px}
.figure{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin:0;overflow:hidden}
.fig-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.fig-scroll svg{display:block;width:100%;min-width:640px;height:auto}
.fig-foot{display:flex;gap:10px 18px;justify-content:space-between;flex-wrap:wrap;padding:10px 14px 12px;border-top:1px solid var(--line);font-size:var(--fs-s);color:var(--ink-2)}
.fig-foot .state{color:var(--ink);max-width:70ch}
.swipe{display:none;color:var(--ink-3);font-size:var(--fs-xs)}
@media (max-width:700px){.swipe{display:block}}
svg .g-water{fill:var(--water)}
svg .g-wline{stroke:var(--water-line);stroke-width:2}
svg .g-wgrp{transition:transform .8s cubic-bezier(.4,.1,.2,1)}
svg .g-sand{fill:var(--sand)} svg .g-sanddot{fill:var(--sand-dot)}
svg .g-clay{fill:var(--clay)} svg .g-clayline{stroke:var(--clay-line);stroke-width:1.4}
svg .g-top{stroke:var(--topsoil);stroke-opacity:.42;fill:none;stroke-linejoin:round}
svg .g-surface{stroke:var(--ink-3);stroke-width:1.4;fill:none;stroke-linejoin:round}
svg .g-gw{stroke:var(--gw);stroke-width:2;stroke-dasharray:7 6;fill:none}
svg .g-veg{stroke:var(--veg);fill:none;stroke-linecap:round}
svg .g-veg2{stroke:var(--veg-2);fill:none;stroke-linecap:round}
svg .g-vegf{fill:var(--veg)} svg .g-veg2f{fill:var(--veg-2)}
svg .g-f1{fill:var(--bloom-1)} svg .g-f2{fill:var(--bloom-2)} svg .g-f3{fill:var(--bloom-3);stroke:var(--line-strong);stroke-width:.6} svg .g-f4{fill:var(--bloom-4)}
svg .g-reed{stroke:var(--reed);fill:none;stroke-linecap:round} svg .g-reedf{fill:var(--reed)}
svg .g-trunk{stroke:var(--trunk);fill:none;stroke-linecap:round}
svg .g-leaf{fill:var(--veg-2);stroke:var(--veg);stroke-width:.8}
svg .g-hl{fill:var(--hl)}
svg .g-sel{stroke:var(--accent);stroke-width:2.2;fill:none}
svg .g-sel-t{fill:var(--accent);font-family:var(--font-display);font-weight:700;font-size:21px;paint-order:stroke;stroke:var(--surface);stroke-width:5px;stroke-linejoin:round}
svg .g-lab{fill:var(--ink-2);font-family:var(--font-body);font-size:15px;font-weight:600;paint-order:stroke;stroke:var(--surface);stroke-width:4px;stroke-linejoin:round}
svg .g-lab-gw{fill:var(--gw);font-family:var(--font-body);font-size:15px;font-weight:700;paint-order:stroke;stroke:var(--sand);stroke-width:4px;stroke-linejoin:round}
svg.marsch .g-lab-gw{stroke:var(--clay)}
svg .g-lab-soil{fill:var(--ink);font-family:var(--font-body);font-size:14px;font-weight:600;paint-order:stroke;stroke:var(--sand);stroke-width:4px;stroke-linejoin:round}
svg .g-dim{stroke:var(--ink);stroke-width:1.6}
svg .g-dimt{fill:var(--ink);font-family:var(--font-body);font-size:16px;font-weight:700;paint-order:stroke;stroke:var(--surface);stroke-width:4px;stroke-linejoin:round}
svg .band{fill:transparent;cursor:pointer}
svg .band:hover{fill:var(--hl)}
svg .only-rain,svg .only-winter,svg .only-dry{display:none}
svg[data-state="rain"] .only-rain,svg[data-state="winter"] .only-winter,svg[data-state="dry"] .only-dry{display:inline}
.bio-chips{margin-block:14px 18px}
.bio-chips .chip{padding:6px 13px}
.bio-chips .num{font-family:var(--font-display);font-weight:700;color:var(--ink-3);font-size:12px}

/* Biotope detail */
.bio-detail{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px}
.bio-detail h2{font-size:var(--fs-2xl)}
.bio-detail .alt{color:var(--ink-3);font-size:var(--fs-l);font-family:var(--font-display);font-weight:500;margin-top:2px}
.bio-grid{display:grid;grid-template-columns:1fr;gap:26px;margin-top:18px}
@media (min-width:900px){.bio-grid{grid-template-columns:minmax(0,1fr) minmax(0,1.1fr)}}
.bio-grid > div{min-width:0;display:flex;flex-direction:column;gap:18px}
.lead{font-size:var(--fs-l);color:var(--ink);max-width:62ch}
dl.facts{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;margin:0}
dl.facts dt{font-size:var(--fs-xs);text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);font-weight:600;padding-top:3px}
dl.facts dd{margin:0}
.block h3{font-size:var(--fs-s);font-family:var(--font-body);text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);font-weight:700;margin-bottom:8px}
.struct-list{list-style:none;padding:0;margin:0;display:grid;gap:6px}
.struct-list li{padding-left:16px;position:relative}
.struct-list li::before{content:"";position:absolute;left:2px;top:.62em;width:7px;height:7px;border-radius:2px;background:var(--accent)}
.struct-list .w{display:block;color:var(--ink-3);font-size:var(--fs-s)}
.fgroup{display:flex;flex-direction:column;gap:6px}
.mini-bloom{display:grid;grid-template-columns:repeat(12,1fr);gap:3px;align-items:end;height:58px}
.mini-bloom .b{background:var(--accent);border-radius:3px 3px 0 0;min-height:2px;opacity:.85}
.mini-bloom .b.zero{background:var(--surface-2);opacity:1}
.mini-lbl{display:grid;grid-template-columns:repeat(12,1fr);gap:3px;font-size:10.5px;color:var(--ink-3);text-align:center;margin-top:3px}

/* Plants */
.filters{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:16px;display:flex;flex-direction:column;gap:12px}
.f-top{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.search{flex:1 1 260px;min-width:0;position:relative}
.search input{width:100%;padding:10px 14px 10px 38px;border-radius:999px;border:1px solid var(--line-strong);background:var(--bg);font:inherit;color:var(--ink)}
.search input:focus{outline:2px solid var(--accent);outline-offset:1px}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--ink-3);fill:none;stroke-width:2}
.f-toggle{display:inline-flex}
.f-panel{display:none;gap:12px 18px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));align-items:end}
.filters.open .f-panel{display:grid}
@media (min-width:860px){.f-toggle{display:none}.f-panel{display:grid}}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field > span{font-size:var(--fs-xs);text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);font-weight:600}
.field select{padding:8px 10px;border-radius:8px;border:1px solid var(--line-strong);background:var(--bg);color:var(--ink);font:inherit;font-size:var(--fs-s);min-width:0}
.zone-toggles{display:flex;gap:6px;flex-wrap:wrap}
.zone-toggles button{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:5px 9px;cursor:pointer;font-size:var(--fs-s)}
.zone-toggles button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.check{display:flex;align-items:center;gap:8px;font-size:var(--fs-s);cursor:pointer;padding-block:6px}
.check input{width:17px;height:17px;accent-color:var(--accent)}
.f-meta{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:var(--fs-s);color:var(--ink-2)}
.linkbtn{border:0;background:none;color:var(--accent);cursor:pointer;font-weight:600;padding:0;font-size:var(--fs-s);text-decoration:underline;text-underline-offset:3px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 14px 12px;display:flex;flex-direction:column;gap:10px;cursor:pointer;transition:border-color .15s, transform .15s}
.card:hover{border-color:var(--line-strong);transform:translateY(-1px)}
.card-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card-top .type{font-size:var(--fs-xs);color:var(--ink-3);font-weight:600;text-transform:uppercase;letter-spacing:.07em}
.card h3{font-size:var(--fs-l)}
.card h3 button{all:unset;cursor:pointer}
.card h3 button:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.card .names{display:flex;flex-direction:column;gap:1px}
.card .en{font-size:var(--fs-s);color:var(--ink-3)}
.meters{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:center;font-size:var(--fs-xs);color:var(--ink-3)}
.meter{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;max-width:120px}
.meter i{height:7px;border-radius:2px;background:var(--surface-2)}
.meter.fl i.on{background:var(--m-flood)} .meter.dr i.on{background:var(--m-drought)} .meter.po i.on{background:var(--m-poll)}
.strip{display:grid;grid-template-columns:repeat(12,1fr);gap:2px}
.strip i{height:9px;border-radius:2px;background:var(--surface-2)}
.strip i.on{background:var(--c);box-shadow:inset 0 0 0 1px var(--line-strong)}
.strip-l{display:grid;grid-template-columns:repeat(12,1fr);gap:2px;font-size:9.5px;color:var(--ink-3);text-align:center;margin-top:2px}
.card-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto;padding-top:4px;flex-wrap:wrap}
.card-foot .facts{font-size:var(--fs-xs);color:var(--ink-2);display:flex;gap:10px;flex-wrap:wrap}
.mixbtn{border:1px solid var(--line-strong);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:var(--fs-xs);font-weight:700;cursor:pointer;white-space:nowrap}
.mixbtn:hover{border-color:var(--accent)}
.mixbtn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.empty{padding:40px 20px;text-align:center;color:var(--ink-2);background:var(--surface);border:1px dashed var(--line-strong);border-radius:14px;display:flex;flex-direction:column;align-items:center;gap:12px}
details.avoid{margin-top:26px;background:var(--surface);border:1px solid var(--line);border-radius:14px}
details.avoid summary{cursor:pointer;padding:14px 18px;font-family:var(--font-display);font-weight:700;font-size:var(--fs-l);list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px}
details.avoid summary::-webkit-details-marker{display:none}
details.avoid summary::after{content:"+";font-size:22px;color:var(--ink-3)}
details.avoid[open] summary::after{content:"−"}
.avoid-list{display:grid;gap:0;padding:0 18px 12px}
.avoid-row{display:grid;grid-template-columns:1fr;gap:4px 18px;padding:12px 0;border-top:1px solid var(--line)}
@media (min-width:760px){.avoid-row{grid-template-columns:minmax(0,1fr) minmax(0,1.4fr) minmax(0,1.2fr)}}
.avoid-row > div{min-width:0}

/* Fauna */
.fcard .grp{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--accent)}
.fcard .tx{font-size:var(--fs-s);color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.fcard .counts{font-size:var(--fs-xs);color:var(--ink-3)}

/* Mix */
.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--accent-soft);border-radius:12px;padding:12px 16px;margin-bottom:16px;font-size:var(--fs-s)}
.banner p{max-width:70ch}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.tile .v{font-family:var(--font-display);font-size:var(--fs-2xl);font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.tile .v small{font-size:var(--fs-m);color:var(--ink-3);font-weight:500}

.cal-body{position:relative}

.notes .ic.w{background:var(--warn-soft);color:var(--warn)}

textarea.export{width:100%;min-height:150px;border-radius:10px;border:1px solid var(--line-strong);background:var(--bg);color:var(--ink);font:inherit;font-size:var(--fs-s);padding:10px;resize:vertical}
.row-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:var(--fs-s)}

function filterSpecies(){
  const f=S.f, q=f.q.trim().toLowerCase();
  let list=DATA.species.filter(s=>{
    if(q&&!(s.de.toLowerCase().includes(q)||s.en.toLowerCase().includes(q)||s.la.toLowerCase().includes(q)))return false;
    if(f.zones.size&&!f.zones.has(s.z))return false;
    if(f.soil&&!(s.so===f.soil||s.so==="both"))return false;
    if(f.flood&&s.fl<f.flood)return false;
    if(f.month&&!inMonth(s.m,f.month))return false;
    if(f.poll&&s.p<4)return false;
    if(f.salt&&s.sa==="low")return false;
    if(f.type&&s.t!==f.type)return false;
    return true;});
  const coll=new Intl.Collator(S.lang);
  const by={zone:(a,b)=>a.z.localeCompare(b.z)||coll.compare(a.de,b.de),name:(a,b)=>coll.compare(a.de,b.de),latin:(a,b)=>a.la.localeCompare(b.la),
    flower:(a,b)=>a.m[0]-b.m[0]||a.m[1]-b.m[1]||coll.compare(a.de,b.de),poll:(a,b)=>b.p-a.p||coll.compare(a.de,b.de)};
  return list.sort(by[f.sort]);
}

/* ---------- mix ---------- */
function mixAnalysis(){
  const ids=S.mix, sp=ids.map(id=>SP[id]);
  const nectar=[];for(let i=1;i<=12;i++)nectar.push(sp.filter(s=>s.p>=3&&inMonth(s.m,i)));
  const zones={A:0,B:0,C:0,D:0};sp.forEach(s=>zones[s.z]++);
  const goodMonths=[3,4,5,6,7,8,9,10].filter(m=>nectar[m-1].length>=3).length;
  const gaps=[3,4,5,6,7,8,9,10].filter(m=>nectar[m-1].length<2);
  const sup={};
  ids.forEach(id=>spFauna[id].forEach(({f,role})=>{(sup[f]=sup[f]||new Set()).add(id);}));
  return {sp,nectar,zones,goodMonths,gaps,sup};
}
function nectarChart(nectar,gaps){
  const W=600,H=210,ml=30,mr=8,mt=14,mb=30,pw=W-ml-mr,ph=H-mt-mb;
  const counts=nectar.map(a=>a.length),mx=Math.max(4,...counts);
  const step=mx<=6?1:(mx<=12?2:5), top=Math.ceil(mx/step)*step;
  const y=v=>mt+ph-v/top*ph, cw=pw/12, bw=cw*.6;
  let g="";
  for(let v=0;v<=top;v+=step){g+=`<line class="${v?"grid-l":"base"}" x1="${ml}" x2="${W-mr}" y1="${f1(y(v))}" y2="${f1(y(v))}"/><text class="ax" x="${ml-8}" y="${f1(y(v)+4)}" text-anchor="end">${v}</text>`;}
  counts.forEach((c,i)=>{
    const x=ml+i*cw+(cw-bw)/2, yy=y(c), h=mt+ph-yy;
    g+=`<g class="col" data-i="${i}">`;
    if(c>0){const r=Math.min(4,h);g+=`<path class="bar" d="M${f1(x)} ${f1(mt+ph)} L${f1(x)} ${f1(yy+r)} Q${f1(x)} ${f1(yy)} ${f1(x+r)} ${f1(yy)} L${f1(x+bw-r)} ${f1(yy)} Q${f1(x+bw)} ${f1(yy)} ${f1(x+bw)} ${f1(yy+r)} L${f1(x+bw)} ${f1(mt+ph)} Z"/>`;}
    if(gaps.includes(i+1)) g+=`<text class="gap-t" x="${f1(x+bw/2)}" y="${f1(yy-6)}" text-anchor="middle">${esc(t("gap"))}</text>`;
    g+=`<text class="ax" x="${f1(ml+i*cw+cw/2)}" y="${H-10}" text-anchor="middle">${ROMAN[i]}</text>`;
    g+=`<rect class="hit" x="${f1(ml+i*cw)}" y="${mt}" width="${f1(cw)}" height="${ph+mb}" data-tip="nectar" data-i="${i}"/></g>`;
  });
  return `<div class="chart" id="nectar-chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(t("nectarT"))}: ${counts.map((c,i)=>ROMAN[i]+" "+c).join(", ")}">${g}</svg></div>`;
}

function renderMix(){
  const el=$("#p-mix");
  const head=`<div class="panel-head"><div><h2>${esc(t("mixTitle"))}</h2><p>${esc(t("mixIntro"))}</p></div>
   <div class="row-actions">${S.mix.length?(S.confirmClear?`<span class="confirm">${esc(t("clearQ",{n:S.mix.length}))} <button type="button" class="btn primary" data-act="mix-clear-yes">${esc(t("yes"))}</button><button type="button" class="btn" data-act="mix-clear-no">${esc(t("cancel"))}</button></span>`:`<button type="button" class="btn" data-act="mix-clear">${esc(t("clear"))}</button>`):""}${!S.mixExample?`<button type="button" class="btn ghost" data-act="mix-example">${esc(t("loadEx"))}</button>`:""}</div></div>`;
  if(!S.mix.length){
    el.innerHTML=head+`<div class="empty"><h3>${esc(t("emptyT"))}</h3><p style="max-width:52ch">${esc(t("emptyP"))}</p><div class="row-actions" style="justify-content:center"><button type="button" class="btn primary" data-act="tab" data-v="plants">${esc(t("goPlants"))}</button><button type="button" class="btn" data-act="tab" data-v="biotopes">${esc(t("goBio"))}</button></div></div>`;
    return;}
  const A=mixAnalysis();
  const notes=[];
  const spread=A.sp.filter(s=>s.f.includes("spread")).map(s=>s.de);
  if(spread.length) notes.push(["w",t("spreadW",{l:listJoin(spread)})]);
  const g=A.sp.filter(s=>s.so==="geest").map(s=>s.de), m=A.sp.filter(s=>s.so==="marsch").map(s=>s.de);
  if(g.length&&m.length) notes.push(["w",t("soilW",{g:listJoin(g),m:listJoin(m)})]);
  if(A.gaps.length){
    const mo=listJoin(A.gaps.map(k=>T[S.lang].months[k-1]));
    const zonesIn=new Set(A.sp.map(s=>s.z));
    const cand=DATA.species.filter(s=>!S.mix.includes(s.id)&&s.p>=4&&!s.f.includes("spread")&&A.gaps.some(k=>inMonth(s.m,k))&&zonesIn.has(s.z))
      .sort((a,b)=>A.gaps.filter(k=>inMonth(b.m,k)).length-A.gaps.filter(k=>inMonth(a.m,k)).length||b.p-a.p).slice(0,4);
    notes.push(["w",cand.length?t("gapW",{mo,l:cand.map(s=>s.de).join(", ")}):t("gapW0",{mo}),cand.map(s=>s.id)]);
  } else notes.push(["ok",t("okNectar")]);
  const prot=A.sp.filter(s=>s.f.includes("protected")).map(s=>s.de);
  if(prot.length) notes.push(["w",t("protW",{l:listJoin(prot)})]);
  const missing=["A","B","C","D"].filter(z=>!A.zones[z]).map(z=>t("zones."+z));
  if(missing.length) notes.push(["i",t("zoneI",{z:listJoin(missing)})]);
  const supIds=Object.keys(A.sup).sort((a,b)=>A.sup[b].size-A.sup[a].size);
  const isSpec=fid=>/oligolect|Specialist|Spezialist/i.test(FA[fid].st.en)&&FA[fid].pl.filter(p=>p[1]==="pollen"||p[1]==="host").some(p=>S.mix.includes(p[0]));
  const exportTxt=A.sp.slice().sort((a,b)=>a.z.localeCompare(b.z)||a.de.localeCompare(b.de)).map(s=>`${s.z} · ${s.de} – ${s.la}`).join("\n");
  el.innerHTML=head+
   (S.mixExample?`<div class="banner"><p>${esc(t("exampleBanner"))}</p></div>`:"")+
   `<div class="tiles">
     <div class="tile"><div class="v">${A.sp.length}</div><div class="k">${esc(t("tSpecies"))}</div></div>
     <div class="tile"><div class="zones">${["A","B","C","D"].map(z=>`<span class="zb ${z}${A.zones[z]?"":" off"}" title="${esc(t("zones."+z))}: ${A.zones[z]}">${z}</span>`).join("")}</div><div class="k">${esc(t("tZones"))}</div></div>
     <div class="tile"><div class="v">${A.goodMonths}<small> / 8</small></div><div class="k">${esc(t("tMonths"))}</div></div>
     <div class="tile"><div class="v">${supIds.length}</div><div class="k">${esc(t("tFauna"))}</div></div>
   </div>
   <div class="mix-grid"><div>
     <div class="box"><h3>${esc(t("nectarT"))}</h3><p class="sub">${esc(t("nectarS"))}</p>${nectarChart(A.nectar,A.gaps)}</div>
     <div class="box"><h3>${esc(t("calT"))}</h3><p class="sub">${esc(t("calS"))}</p>${calendar(A.sp)}</div>
   </div><div>
     <div class="box"><h3>${esc(t("notesT"))}</h3><ul class="notes" style="margin-top:10px">${notes.map(([k,txt,cand])=>`<li><span class="ic ${k}">${k==="w"?"!":(k==="ok"?"✓":"i")}</span><div>${esc(txt)}${cand&&cand.length?`<div class="chips" style="margin-top:6px">${cand.map(id=>`<button type="button" class="chip" data-act="mix-toggle" data-id="${id}"><span class="dot" style="--c:${col(SP[id].c)}"></span>+ ${esc(SP[id].de)}</button>`).join("")}</div>`:""}</div></li>`).join("")}</ul></div>
     <div class="box"><h3>${esc(t("supT"))}</h3><p class="sub">${esc(t("supS"))}</p><div class="chips">${supIds.map(fid=>faChip(fid,isSpec(fid)?t("specialist"):"")).join("")||"–"}</div></div>
     <div class="box"><h3>${esc(t("exportT"))}</h3><textarea class="export" id="export" readonly>${esc(exportTxt)}</textarea><div class="row-actions" style="margin-top:8px"><button type="button" class="btn" data-act="copy">${esc(t("copy"))}</button></div></div>
   </div></div>`;
}
function showTip(target){
  const chart=target.closest(".chart");if(!chart)return;
  let tip=chart.querySelector(".tip");if(!tip){tip=document.createElement("div");tip.className="tip";chart.appendChild(tip);}
  const i=+target.dataset.i, A=mixAnalysis(), list=A.nectar[i];
  const names=list.slice(0,8).map(s=>esc(s.de)).join(", ")+(list.length>8?` +${list.length-8}`:"");
  tip.innerHTML=`<b>${esc(T[S.lang].months[i])}</b> · ${list.length}<br>${names||"–"}`;
  const cb=chart.getBoundingClientRect(), tb=target.getBoundingClientRect();
  let left=tb.left-cb.left+tb.width/2-110; left=Math.max(0,Math.min(left,cb.width-230));
  tip.style.left=left+"px"; tip.style.top="0px"; tip.hidden=false;
}
function hideTip(){document.querySelectorAll(".chart .tip").forEach(t=>t.hidden=true);}

/* ---------- guide ---------- */
function guideTable(kind){
  if(kind==="types"){
    return `<div class="tbl-wrap"><table class="types"><thead><tr><th>${esc(t("th.type"))}</th><th>${esc(t("th.fn"))}</th><th>${esc(t("th.water"))}</th><th>${esc(t("th.soil"))}</th><th>${esc(t("th.bio"))}</th></tr></thead><tbody>${DATA.types.map(r=>`<tr><td><b>${esc(L(r))}</b><br><span class="small muted">${esc(S.lang==="de"?r.en:r.de)}</span></td><td>${esc(S.lang==="de"?r.fn_de:r.fn_en)}</td><td>${esc(S.lang==="de"?r.d_de:r.d_en)}</td><td>${esc(S.lang==="de"?r.s_de:r.s_en)}</td><td><div class="chips">${r.b.map(b=>bioChip(b)).join("")}</div></td></tr>`).join("")}</tbody></table></div>`;}
  if(kind==="structures"){
    return `<div class="tbl-wrap"><table class="structs"><thead><tr><th>${esc(t("th.struct"))}</th><th>${esc(t("th.where"))}</th><th>${esc(t("th.who"))}</th></tr></thead><tbody>${Object.keys(DATA.struct).filter(k=>stFauna[k]).map(k=>`<tr><td><b>${esc(L(DATA.struct[k]))}</b></td><td>${esc(S.lang==="de"?DATA.struct[k].wde:DATA.struct[k].wen)}</td><td><div class="chips">${stFauna[k].map(fid=>faChip(fid)).join("")}</div></td></tr>`).join("")}</tbody></table></div>`;}
  if(kind==="care"){
    return `<div class="tbl-wrap"><table class="care"><thead><tr><th>${esc(t("th.task"))}</th>${T[S.lang].months.map((m,i)=>`<th class="m" title="${esc(m)}">${ROMAN[i]}</th>`).join("")}</tr></thead><tbody>${DATA.care.map(r=>`<tr><td>${esc(L(r))}</td>${Array.from({length:12},(_,i)=>`<td class="m${r.m.includes(i+1)?" on":""}"><i></i></td>`).join("")}</tr>`).join("")}</tbody></table></div>`;}
  return "";
}
function renderGuide(){
  const G=DATA.guide;
  $("#p-guide").innerHTML=`
  <div class="panel-head"><div><h2>${esc(t("guideTitle"))}</h2><p>${esc(t("guideIntro"))}</p></div></div>
  <div class="guide">
   <nav class="toc" aria-label="Contents">${G.map((s,i)=>`<button type="button" data-act="toc" data-v="${s.id}"><span class="num">${i+1}</span>${esc(S.lang==="de"?s.de_t:s.en_t)}</button>`).join("")}</nav>
   <div class="g-body">${G.map((s,i)=>`<section class="g-sec" id="g-${s.id}"><h2><span class="num">${String(i+1).padStart(2,"0")}</span>${esc(S.lang==="de"?s.de_t:s.en_t)}</h2>${S.lang==="de"?s.de:s.en}${s.table?guideTable(s.table):""}${s.action==="crosssection"?`<div style="margin-top:12px"><button type="button" class="btn primary" data-act="goto-cross">${esc(t("showCross"))}</button></div>`:""}${(S.lang==="de"?s.de_after:s.en_after)||""}</section>`).join("")}</div>
  </div>`;
}

/* ---------- sheet ---------- */
function sheetSpecies(s){
  const inm=S.mix.includes(s.id);
  const bios=spBio[s.id];
  const fa=spFauna[s.id];
  const byF={};fa.forEach(({f,role})=>{(byF[f]=byF[f]||[]).push(L(DATA.roles[role]));});
  return `<div class="card-top"><span class="zb ${s.z}">${s.z}</span><span class="small">${esc(t("zones."+s.z))} · ${esc(t("zonesSub."+s.z))}</span>${s.f.map(fl=>`<span class="pill warn">${esc(t("flags."+fl))}</span>`).join("")}</div>
  <div><h2 id="sheet-title">${esc(s.de)}</h2><p class="latin">${esc(s.la)}</p><p class="muted">${esc(s.en)}</p></div>
  <div style="display:flex;flex-direction:column;gap:8px">
   <div class="mrow"><span>${esc(t("meters.fl"))}</span>${meter("fl",s.fl)}<b>${s.fl}/5</b></div>
   <div class="mrow"><span>${esc(t("meters.dr"))}</span>${meter("dr",s.dr)}<b>${s.dr}/5</b></div>
   <div class="mrow"><span>${esc(t("meters.po"))}</span>${meter("po",s.p)}<b>${s.p}/5</b></div>
  </div>
  <p>${esc(L(s.n))}</p>
  <div class="kv">
   <div><div class="k">${esc(t("typeL"))}</div><div class="v">${esc(t("types."+s.t))}</div></div>
   <div><div class="k">${esc(t("height"))}</div><div class="v">${esc(s.h)}</div></div>
   <div><div class="k">${esc(t("flowering"))}</div><div class="v">${esc(range(s.m))}</div></div>
   <div><div class="k">${esc(t("colour"))}</div><div class="v"><span class="dot" style="--c:${col(s.c)}"></span>${esc(colName(s.c))}</div></div>
   <div><div class="k">${esc(t("habit"))}</div><div class="v">${esc(t("habits."+s.hb))}</div></div>
   <div><div class="k">${esc(t("soil"))}</div><div class="v">${esc(t("soils."+s.so))}</div></div>
   <div><div class="k">${esc(t("saltL"))}</div><div class="v">${esc(t("salts."+s.sa))}</div></div>
  </div>
  <div>${strip(s.m,col(s.c),true)}</div>
  <div class="block"><h3>${esc(t("inBio"))}</h3><div class="chips">${bios.map(x=>bioChip(x.b,x.core?t("asCore"):t("asComp"))).join("")}</div></div>
  ${Object.keys(byF).length?`<div class="block"><h3>${esc(t("usedBy"))}</h3><div class="chips">${Object.keys(byF).map(fid=>faChip(fid,[...new Set(byF[fid])].join(", "))).join("")}</div></div>`:""}
  <div><button type="button" class="btn ${inm?"":"primary"}" data-act="mix-toggle" data-id="${s.id}" aria-pressed="${inm}">${esc(inm?t("removeMix"):t("addMixLong"))}</button></div>`;
}
function sheetFauna(f){
  const roles={};f.pl.forEach(([pid,role])=>{(roles[role]=roles[role]||[]).push(pid);});
  return `<div class="card-top"><span class="grp" style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--accent)">${esc(L(DATA.groups[f.g]))}</span><span class="pill">${esc(L(f.st))}</span></div>
  <div><h2 id="sheet-title">${esc(faName(f))}</h2><p class="latin">${esc(f.la)}</p><p class="muted">${esc(faAlt(f))}</p></div>
  <p>${esc(L(f.tx))}</p>
  <div class="block"><h3>${esc(t("active"))} · ${esc(range(f.m))}</h3>${strip(f.m,"var(--accent)",true)}</div>
  ${f.pl.length?`<div class="block"><h3>${esc(t("needsPlants"))}</h3>${Object.keys(roles).map(r=>`<div class="rolegrp"><span class="small">${esc(L(DATA.roles[r]))}</span><div class="chips">${roles[r].map(id=>spChip(id)).join("")}</div></div>`).join("")}</div>`:""}
  <div class="block"><h3>${esc(t("needsStruct"))}</h3><ul class="struct-list">${f.sr.map(k=>`<li>${esc(L(DATA.struct[k]))}<span class="w">${esc(S.lang==="de"?DATA.struct[k].wde:DATA.struct[k].wen)}</span></li>`).join("")}</ul></div>
  <div class="block"><h3>${esc(t("foundIn"))}</h3><div class="chips">${(faBio[f.id]||[]).map(b=>bioChip(b)).join("")}</div></div>`;
}
function renderSheet(){
  const top=S.stack[S.stack.length-1], wrap=$("#sheet");
  if(!top){wrap.hidden=true;document.body.style.overflow="";return;}
  wrap.hidden=false;document.body.style.overflow="hidden";
  $("#sheet-back-slot").innerHTML=S.stack.length>1?`<button type="button" class="iconbtn" data-act="sheet-back">← ${esc(t("back"))}</button>`:"";
  $("#sheet-close").textContent=t("close");
  const body=$("#sheet-body");
  body.innerHTML=top.type==="sp"?sheetSpecies(SP[top.id]):sheetFauna(FA[top.id]);
  body.scrollTop=0;
}
function openSheet(type,id){
  if(!S.stack.length) S.lastFocus=document.activeElement;
  const top=S.stack[S.stack.length-1];
  if(top&&top.type===type&&top.id===id) return;
  S.stack.push({type,id});renderSheet();
  setTimeout(()=>{const c=$("#sheet-close");if(c)c.focus({preventScroll:true});},30);
}
function closeSheet(){S.stack=[];renderSheet();if(S.lastFocus&&document.contains(S.lastFocus))S.lastFocus.focus({preventScroll:true});}

/* ---------- mix ops ---------- */
function afterMixChange(){
  saveMix();updateBadge();
  if(S.tab==="mix")renderMix();
  if(S.tab==="plants")document.querySelectorAll("#pl-grid .mixbtn").forEach(b=>{const on=S.mix.includes(b.dataset.id);b.setAttribute("aria-pressed",on);b.textContent=on?t("inMix"):t("addMix");});
  if(S.stack.length)renderSheet();
}
function toggleMix(id){
  const s=SP[id];
  if(S.mix.includes(id)){S.mix=S.mix.filter(x=>x!==id);toast((S.lang==="de"?"Entfernt: ":"Removed: ")+s.de);}
  else{S.mix.push(id);toast((S.lang==="de"?"Hinzugefügt: ":"Added: ")+s.de);}
  S.mixExample=false;S.confirmClear=false;afterMixChange();
}

/* ---------- routing ---------- */
const renderers={biotopes:renderBiotopes,plants:renderPlants,fauna:renderFauna,mix:renderMix,guide:renderGuide};
function setTab(k,noHash){
  S.tab=k;S.confirmClear=false;
  document.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-selected",b.dataset.v===k));
  TABS.forEach(x=>{$("#p-"+x).hidden=x!==k;});
  renderers[k]();revealTab();
  if(!noHash){try{history.replaceState(null,"","#"+k);}catch(e){try{location.hash=k;}catch(e2){}}}
}
function renderAll(){renderChrome();renderers[S.tab]();if(S.stack.length)renderSheet();}

/* ---------- events ---------- */
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-act]");if(!el)return;
  const a=el.dataset.act,v=el.dataset.v,id=el.dataset.id;
  switch(a){
    case "lang": S.lang=v;store.set("wf_lang",v);renderAll();break;
    case "tab": if(S.stack.length)closeSheet();setTab(v);window.scrollTo({top:0});break;
    case "profile": S.profile=v;renderBiotopes();break;
    case "water": S.water=v;updateWater();break;
    case "bio": if(S.stack.length)closeSheet();selectBio(id,el.closest("#p-biotopes")===null||el.classList.contains("chip"));break;
    case "sp": openSheet("sp",id);break;
    case "fa": openSheet("fa",id);break;
    case "sheet-close": closeSheet();break;
    case "sheet-back": S.stack.pop();renderSheet();break;
    case "mix-toggle": e.stopPropagation();toggleMix(id);break;
    case "mix-add-bio":{const b=BI[id];const add=b.core.concat(b.comp).filter(x=>!S.mix.includes(x));S.mix=S.mix.concat(add);S.mixExample=false;afterMixChange();toast(add.length?t("added",{n:add.length}):t("already"));break;}
    case "mix-clear": S.confirmClear=true;renderMix();break;
    case "mix-clear-no": S.confirmClear=false;renderMix();break;
    case "mix-clear-yes": S.mix=[];S.mixExample=false;S.confirmClear=false;afterMixChange();break;
    case "mix-example": S.mix=EXAMPLE.slice();S.mixExample=true;afterMixChange();break;
    case "copy":{const ta=$("#export");const txt=ta.value;const fail=()=>{ta.focus();ta.select();toast(t("copyFail"));};
      try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(()=>toast(t("copied")),fail);}else fail();}catch(err){fail();}break;}
    case "f-open": S.filtersOpen=!S.filtersOpen;$("#filters").classList.toggle("open",S.filtersOpen);el.setAttribute("aria-expanded",S.filtersOpen);break;
    case "f-zone": if(S.f.zones.has(v))S.f.zones.delete(v);else S.f.zones.add(v);el.setAttribute("aria-pressed",S.f.zones.has(v));renderPlantResults();break;
    case "f-reset": S.f={q:"",zones:new Set(),soil:"",flood:0,month:0,poll:false,salt:false,type:"",sort:S.f.sort};renderPlants();break;
    case "fa-group": S.fg=v;document.querySelectorAll("[data-act='fa-group']").forEach(b=>b.setAttribute("aria-pressed",b.dataset.v===S.fg));renderFaunaResults();break;
    case "toc":{const sec=$("#g-"+v);if(sec)sec.scrollIntoView({behavior:"smooth",block:"start"});break;}
    case "goto-cross": setTab("biotopes");setTimeout(()=>{const f=$("#cross");if(f)f.scrollIntoView({behavior:"smooth",block:"center"});},50);break;
  }
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&S.stack.length){closeSheet();return;}
  if((e.key==="Enter"||e.key===" ")&&e.target.matches&&e.target.matches("svg .band")){e.preventDefault();e.target.dispatchEvent(new MouseEvent("click",{bubbles:true}));}
});
document.addEventListener("input",e=>{
  const id=e.target.id;
  if(id==="f-q"){S.f.q=e.target.value;renderPlantResults();}
  else if(id==="fa-q"){S.fq=e.target.value;renderFaunaResults();}
});
document.addEventListener("change",e=>{
  const id=e.target.id,v=e.target.value;
  if(id==="f-soil")S.f.soil=v;
  else if(id==="f-flood")S.f.flood=+v;
  else if(id==="f-month")S.f.month=+v;
  else if(id==="f-type")S.f.type=v;
  else if(id==="f-sort")S.f.sort=v;
  else if(id==="f-poll")S.f.poll=e.target.checked;
  else if(id==="f-salt")S.f.salt=e.target.checked;
  else return;
  renderPlantResults();
});
document.addEventListener("mouseover",e=>{const h=e.target.closest&&e.target.closest("[data-tip]");if(h)showTip(h);});
document.addEventListener("mouseout",e=>{const h=e.target.closest&&e.target.closest("[data-tip]");if(h&&!(e.relatedTarget&&h.contains(e.relatedTarget)))hideTip();});
document.addEventListener("click",e=>{const h=e.target.closest&&e.target.closest("[data-tip]");if(h)showTip(h);else hideTip();},true);
document.addEventListener("keydown",e=>{
  const tabs=[...document.querySelectorAll(".tab")];const i=tabs.indexOf(document.activeElement);
  if(i<0)return;
  if(e.key==="ArrowRight"||e.key==="ArrowLeft"){e.preventDefault();const n=tabs[(i+(e.key==="ArrowRight"?1:-1)+tabs.length)%tabs.length];n.focus();n.click();}
});

/* ---------- boot ---------- */
const h=(location.hash||"").replace("#","");
if(TABS.includes(h))S.tab=h;
renderChrome();renderers[S.tab]();
})();
</script>
